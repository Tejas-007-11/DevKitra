<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match — DevKitra Gaming</title>
<meta name="description" content="Flip cards and find matching pairs in as few moves as possible. Play Memory Match instantly in your browser." />
<link rel="canonical" href="https://devkitra.in/game/memory-match" />
<style>
* { box-sizing: border-box; }
:root {
  --ink: #0b0d11;
  --panel: #10141c;
  --line: #1f2939;
  --text: #e8edf4;
  --muted: #8a93a1;
  --accent: #5b4bff;
}
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
header { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.5rem 0 1rem; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.1rem; letter-spacing: -0.02em; font-weight: 700; }
a.back { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
a.back:hover { color: var(--text); }
#wrap { max-width: 420px; width: 100%; border-radius: 12px; padding: 0.5rem; background: var(--panel); border: 1px solid var(--line); }
.hud { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.8rem; font-variant-numeric: tabular-nums; }
.hud b { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 auto 1rem; max-width: 370px; touch-action: none; }
.card { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--accent); cursor: pointer; transform-style: preserve-3d; transition: transform 0.25s ease; border: 2px solid transparent; }
.card.flipped { transform: rotateY(180deg); border-color: rgba(91, 75, 255, 0.4); }
.card.matched { opacity: 0.45; border-color: #4ade80; cursor: default; }
.card .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
.card .face.front { background: #131926; border: 1px solid var(--line); }
.card .face.back { transform: rotateY(180deg); }
.symbol { width: 52%; height: 52%; border-radius: 50%; border: 6px solid; }
.symbol.s2 { border-radius: 0; }
.symbol.s3 { width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 28px solid; }
.symbol.s4 { width: 34%; height: 34%; transform: rotate(45deg); border: 6px solid; }
.symbol.s5 { width: 14px; height: 34%; background: currentColor; position: relative; }
.symbol.s5::after { content: ''; position: absolute; inset: 0; background: currentColor; transform: rotate(90deg); }
.symbol.s6 { width: 30%; height: 30%; border: 6px solid; border-radius: 50%; background: transparent; }
.symbol.s7 { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid; }
.symbol.s8 { width: 26%; height: 26%; border: 4px solid; border-radius: 2px; }
.symbol { color: #fff; }
.overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(11, 13, 17, 0.88); z-index: 10; text-align: center; padding: 0 1rem; }
.overlay h2 { margin: 0 0 0.5rem; font-size: 1.5rem; }
.overlay p { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 0.6rem 1.2rem; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
.btn:hover { background: #4736e8; }
@media (max-width: 420px) { header { padding: 0.5rem 0 0.75rem; } }
</style>
</head>
<body>
<header>
  <h1>Memory Match</h1>
  <a class="back" href="/game/memory-match">← Library</a>
</header>
<div id="wrap">
  <div class="hud">Moves <b id="moves">0</b> <span style="opacity:0.4">·</span> Best <b id="best">0</b></div>
  <div class="board" id="board"></div>
  <div id="won" class="overlay">
    <h2>All pairs found!</h2>
    <p>Moves <b id="final-moves">0</b> <span style="opacity:0.4">·</span> Best <b id="final-best">0</b></p>
    <button class="btn" id="restart-btn">Play again</button>
  </div>
</div>
<script>
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const bestEl = document.getElementById('best');
const wonEl = document.getElementById('won');
const finalMovesEl = document.getElementById('final-moves');
const finalBestEl = document.getElementById('final-best');
let best = Number(localStorage.getItem('dk:memory-best') || 0);
bestEl.textContent = best;
let moves = 0;
let first = null;
let lock = false;
let matched = 0;

const SYMBOLS = [
  { kind: 's1' }, { kind: 's2' }, { kind: 's3' }, { kind: 's4' },
  { kind: 's5' }, { kind: 's6' }, { kind: 's7' }, { kind: 's8' },
];

function post(payload) {
  if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
}
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'dk:restart') resetGame();
});

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function resetGame() {
  moves = 0;
  matched = 0;
  first = null;
  lock = false;
  movesEl.textContent = moves;
  wonEl.style.display = 'none';
  boardEl.innerHTML = '';
  const ids = shuffle([...SYMBOLS, ...SYMBOLS]);
  ids.forEach((symbol, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.kind = symbol.kind;
    card.dataset.index = index;
    card.innerHTML = `
      <div class="face front"></div>
      <div class="face back"><div class="symbol ${symbol.kind}"></div></div>
    `;
    card.addEventListener('pointerdown', () => flip(card));
    card.addEventListener('touchstart', (event) => { event.preventDefault(); flip(card); }, { passive: false });
    boardEl.appendChild(card);
  });
  post({ type: 'dk:ready', id: 'memory-match', title: 'Memory Match' });
}

function flip(card) {
  if (lock || card === first || card.classList.contains('matched') || card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  if (!first) {
    first = card;
    return;
  }
  lock = true;
  moves++;
  movesEl.textContent = moves;
  if (first.dataset.kind === card.dataset.kind) {
    first.classList.add('matched');
    card.classList.add('matched');
    matched += 2;
    first = null;
    lock = false;
    if (matched === 16) endGame();
    return;
  }
  setTimeout(() => {
    first.classList.remove('flipped');
    card.classList.remove('flipped');
    first = null;
    lock = false;
  }, 700);
}

function endGame() {
  if (!best || moves < best) {
    best = moves;
    try { localStorage.setItem('dk:memory-best', String(best)); } catch (_) {}
    bestEl.textContent = best;
  }
  finalMovesEl.textContent = moves;
  finalBestEl.textContent = best;
  wonEl.style.display = 'flex';
  post({ type: 'dk:gameover', score: moves });
}

document.getElementById('restart-btn').addEventListener('click', resetGame);

resetGame();
post({ type: 'dk:ready', id: 'memory-match', title: 'Memory Match' });
</script>
</body>
</html>
