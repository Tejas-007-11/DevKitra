<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Memory Match thumbnail">
  <defs>
    <linearGradient id="mmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190a18"/>
      <stop offset="100%" stop-color="#08070f"/>
    </linearGradient>
  </defs>
  <rect width="520" height="300" rx="16" fill="url(#mmBg)"/>
  <!-- Ambient glow -->
  <circle cx="340" cy="150" r="110" fill="#ec4899" opacity="0.12"/>
  <!-- 3D Cards -->
  <g transform="translate(190, 45)">
    <!-- Back card -->
    <rect x="0" y="0" width="76" height="96" rx="10" fill="#0c121d" stroke="#252e40" stroke-width="2"/>
    <text x="38" y="55" fill="rgba(255,255,255,0.18)" font-size="28" text-anchor="middle">◆</text>

    <!-- Flipped Matching Card 1 -->
    <rect x="90" y="0" width="76" height="96" rx="10" fill="#15102a" stroke="#10b981" stroke-width="2"/>
    <circle cx="128" cy="48" r="18" fill="none" stroke="#00f0ff" stroke-width="5"/>

    <!-- Flipped Matching Card 2 -->
    <rect x="180" y="0" width="76" height="96" rx="10" fill="#15102a" stroke="#10b981" stroke-width="2"/>
    <circle cx="218" cy="48" r="18" fill="none" stroke="#00f0ff" stroke-width="5"/>

    <!-- Row 2 -->
    <rect x="0" y="110" width="76" height="96" rx="10" fill="#15102a" stroke="#ec4899" stroke-width="2"/>
    <rect x="22" y="142" width="32" height="32" fill="none" stroke="#f59e0b" stroke-width="5"/>

    <rect x="90" y="110" width="76" height="96" rx="10" fill="#0c121d" stroke="#252e40" stroke-width="2"/>
    <text x="128" y="165" fill="rgba(255,255,255,0.18)" font-size="28" text-anchor="middle">◆</text>

    <rect x="180" y="110" width="76" height="96" rx="10" fill="#0c121d" stroke="#252e40" stroke-width="2"/>
    <text x="218" y="165" fill="rgba(255,255,255,0.18)" font-size="28" text-anchor="middle">◆</text>
  </g>
  <!-- Sparkles -->
  <polygon points="360,30 364,42 376,46 364,50 360,62 356,50 344,46 356,42" fill="#10b981"/>
  <polygon points="460,90 463,98 471,101 463,104 460,112 457,104 449,101 457,98" fill="#ec4899"/>
  <!-- Title & Badge -->
  <g font-family="system-ui, sans-serif" font-weight="900">
    <text x="36" y="110" fill="#ec4899" font-size="24" letter-spacing="-0.03em">MEMORY</text>
    <text x="36" y="136" fill="#ec4899" font-size="24" letter-spacing="-0.03em">MATCH</text>
    <rect x="36" y="152" width="78" height="20" rx="4" fill="rgba(236,72,153,0.14)" stroke="rgba(236,72,153,0.3)"/>
    <text x="75" y="166" fill="#ec4899" font-size="10" text-anchor="middle" font-weight="800">CARDS</text>
  </g>
</svg>
