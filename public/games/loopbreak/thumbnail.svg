<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lb-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="60%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="loop-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neon-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="neon-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="neon-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#lb-bg)"/>

  <!-- Subtle circuit grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="130" x2="600" y2="130"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="340" x2="600" y2="340"/>
  </g>

  <!-- Central Loop Aura -->
  <circle cx="300" cy="180" r="160" fill="url(#loop-glow)"/>

  <!-- Energy Beam Loop (Forming a square/diamond loop) -->
  <path d="M 220 120 L 380 120 L 380 240 L 220 240 Z" 
        fill="rgba(6, 182, 212, 0.12)" 
        stroke="#06b6d4" 
        stroke-width="8" 
        stroke-linejoin="round" 
        filter="url(#glow-heavy)"/>
  <path d="M 220 120 L 380 120 L 380 240 L 220 240 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Ambient Board Nodes -->
  <circle cx="140" cy="120" r="16" fill="url(#neon-magenta)" opacity="0.75"/>
  <circle cx="140" cy="190" r="16" fill="url(#neon-amber)" opacity="0.75"/>
  <circle cx="140" cy="260" r="16" fill="url(#neon-emerald)" opacity="0.75"/>
  
  <circle cx="460" cy="120" r="16" fill="url(#neon-violet)" opacity="0.75"/>
  <circle cx="460" cy="190" r="16" fill="url(#neon-emerald)" opacity="0.75"/>
  <circle cx="460" cy="260" r="16" fill="url(#neon-magenta)" opacity="0.75"/>

  <!-- Active Loop Nodes (Cyan Overcharged) -->
  <g filter="url(#glow-heavy)">
    <!-- Top-left -->
    <circle cx="220" cy="120" r="24" fill="url(#neon-cyan)"/>
    <circle cx="220" cy="120" r="12" fill="#ffffff"/>
    
    <!-- Top-right -->
    <circle cx="380" cy="120" r="24" fill="url(#neon-cyan)"/>
    <circle cx="380" cy="120" r="12" fill="#ffffff"/>
    
    <!-- Bottom-right -->
    <circle cx="380" cy="240" r="24" fill="url(#neon-cyan)"/>
    <circle cx="380" cy="240" r="12" fill="#ffffff"/>
    
    <!-- Bottom-left -->
    <circle cx="220" cy="240" r="24" fill="url(#neon-cyan)"/>
    <circle cx="220" cy="240" r="12" fill="#ffffff"/>
  </g>

  <!-- Center Energy Core Flare -->
  <circle cx="300" cy="180" r="18" fill="url(#neon-amber)" filter="url(#glow-heavy)"/>
  <circle cx="300" cy="180" r="8" fill="#ffffff"/>

  <!-- Sparkles / Pulses -->
  <path d="M 300 150 L 303 175 L 328 178 L 303 181 L 300 206 L 297 181 L 272 178 L 297 175 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 380 180 L 382 187 L 389 189 L 382 191 L 380 198 L 378 191 L 371 189 L 378 187 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 220 180 L 222 187 L 229 189 L 222 191 L 220 198 L 218 191 L 211 189 L 218 187 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Badge banner -->
  <rect x="200" y="300" width="200" height="30" rx="15" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="300" y="320" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#38bdf8" letter-spacing="3">ENERGY CIRCUIT</text>

  <!-- Typography -->
  <text x="300" y="365" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="5">
    LOOP<tspan fill="#06b6d4">BREAK</tspan>
  </text>
</svg>

