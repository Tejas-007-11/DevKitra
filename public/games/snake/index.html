<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Classic Snake — Devkitra Gaming</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .hud-bar {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .mode-bar {
      display: flex;
      gap: 6px;
      background: #151b28;
      border: 1px solid #283347;
      padding: 4px;
      border-radius: 999px;
    }
    .mode-btn {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 800;
      color: #94a3b8;
      border-radius: 999px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      color: #ffffff;
      background: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-chip {
      background: #151b28;
      border: 1px solid #283347;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hud-chip b {
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .combo-chip {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #facc15;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    #canvas-wrap {
      position: relative;
      background: #14532d;
      border: 3px solid #283347;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .card-modal {
      background: #151b28;
      border: 1px solid #2d374d;
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-icon {
      font-size: 46px;
      margin-bottom: 8px;
    }
    .card-modal h2 {
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .card-modal p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .stats-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .stat-mini-box {
      background: #0f1420;
      border: 1px solid #252e42;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .stat-mini-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
    }
    .stat-mini-val {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
    }
    .btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
      transition: all 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background: #16a34a;
      transform: translateY(-2px);
    }
    /* Touch Controls */
    .touch-pad {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      justify-content: center;
      gap: 12px;
      z-index: 15;
    }
    @media (pointer: coarse), (max-width: 640px) {
      .touch-pad { display: flex; }
      .mode-bar { display: none; }
    }
    .t-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(21, 27, 40, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .t-btn:active { background: rgba(34, 197, 94, 0.4); }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud-bar">
      <div class="mode-bar">
        <button class="mode-btn active" data-mode="box">Perimeter Wall</button>
        <button class="mode-btn" data-mode="warp">Warp Pass</button>
        <button class="mode-btn" data-mode="maze">Obstacle Maze</button>
      </div>
      <div class="hud-group">
        <span class="combo-chip" id="combo-chip">Combo x2</span>
        <div class="hud-chip">Score: <b id="score-display">0</b></div>
        <div class="hud-chip">Best: <b id="best-display">0</b></div>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="snakeCanvas"></canvas>

      <div id="overlay" class="overlay">
        <div class="card-modal">
          <div class="modal-icon">🐍</div>
          <h2 id="overlay-heading">CLASSIC SNAKE</h2>
          <p id="overlay-desc">Guide the serpent to eat apples and grow your tail. Avoid walls, obstacles, and running into yourself!</p>
          <div class="stats-summary" id="stats-summary" style="display:none;">
            <div class="stat-mini-box">
              <div class="stat-mini-label">Score</div>
              <div class="stat-mini-val" id="final-score">0</div>
            </div>
            <div class="stat-mini-box">
              <div class="stat-mini-label">Best</div>
              <div class="stat-mini-val" id="final-best">0</div>
            </div>
          </div>
          <button id="start-btn" class="btn">START GAME</button>
        </div>
      </div>
    </div>

    <div class="touch-pad">
      <button class="t-btn" id="btn-left">◀</button>
      <button class="t-btn" id="btn-up" style="background:#22c55e; color:#052e16;">▲</button>
      <button class="t-btn" id="btn-down">▼</button>
      <button class="t-btn" id="btn-right">▶</button>
    </div>
  </div>

  <script>
    (function() {
      // Audio synth
      var audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch(e) {}
        }
        return audioCtx;
      }
      function playTone(freq, type, dur, gainVal, endFreq) {
        var actx = getAudio();
        if (!actx) return;
        try {
          var osc = actx.createOscillator();
          var gain = actx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + dur);
          gain.gain.setValueAtTime(gainVal || 0.08, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + dur);
        } catch(e) {}
      }

      function sfxEat(isGold) {
        if (isGold) {
          playTone(580, 'sine', 0.1, 0.1, 880);
          setTimeout(function() { playTone(980, 'sine', 0.18, 0.09, 1320); }, 60);
        } else {
          playTone(340, 'triangle', 0.08, 0.08, 620);
        }
      }
      function sfxTurn() { playTone(220, 'sine', 0.03, 0.03); }
      function sfxCrash() { playTone(180, 'triangle', 0.25, 0.12, 60); }

      var COLS = 20;
      var ROWS = 20;
      var CELL_SIZE = 26;

      var canvas = document.getElementById('snakeCanvas');
      var ctx = canvas.getContext('2d');
      var scoreDisplay = document.getElementById('score-display');
      var bestDisplay = document.getElementById('best-display');
      var comboChip = document.getElementById('combo-chip');
      var overlay = document.getElementById('overlay');
      var overlayHeading = document.getElementById('overlay-heading');
      var overlayDesc = document.getElementById('overlay-desc');
      var statsSummary = document.getElementById('stats-summary');
      var finalScore = document.getElementById('final-score');
      var finalBest = document.getElementById('final-best');
      var startBtn = document.getElementById('start-btn');
      var modeButtons = document.querySelectorAll('.mode-btn');

      function resize() {
        var wrap = document.getElementById('game-container');
        var maxH = (wrap.clientHeight || window.innerHeight) - 100;
        var maxW = (wrap.clientWidth || window.innerWidth) - 40;
        var side = Math.min(maxW, maxH, 600);

        CELL_SIZE = Math.floor(side / COLS);
        var pixelSize = CELL_SIZE * COLS;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(pixelSize * dpr);
        canvas.height = Math.floor(pixelSize * dpr);
        canvas.style.width = pixelSize + 'px';
        canvas.style.height = pixelSize + 'px';

        ctx.resetTransform?.();
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      var isRunning = false;
      var isPaused = false;
      var currentMode = 'box'; // 'box', 'warp', 'maze'
      var score = 0;
      var bestScore = 0;
      try { bestScore = parseInt(localStorage.getItem('dk:snake-best') || '0', 10); } catch(e) {}
      bestDisplay.textContent = bestScore;

      var snake = [];
      var dir = { x: 1, y: 0 };
      var nextDir = { x: 1, y: 0 };
      var food = { x: 5, y: 5, gold: false };
      var obstacles = [];
      var particles = [];
      var callouts = [];
      var comboCount = 0;
      var comboTimer = 0;
      var stepTimer = 0;
      var stepInterval = 120;
      var lastTime = 0;
      var screenShake = 0;

      modeButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          modeButtons.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          if (isRunning) initGame();
        });
      });

      function generateObstacles() {
        obstacles = [];
        if (currentMode === 'maze') {
          // Center pillars & L walls
          for (var i = 4; i < 9; i++) {
            obstacles.push({ x: i, y: 6 });
            obstacles.push({ x: COLS - 1 - i, y: ROWS - 7 });
          }
          for (var j = 6; j < 14; j++) {
            obstacles.push({ x: 10, y: j });
          }
        }
      }

      function spawnFood() {
        var free = [];
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            var onSnake = snake.some(function(s) { return s.x === c && s.y === r; });
            var onObs = obstacles.some(function(o) { return o.x === c && o.y === r; });
            if (!onSnake && !onObs) free.push({ x: c, y: r });
          }
        }
        if (!free.length) return;
        var chosen = free[Math.floor(Math.random() * free.length)];
        food = {
          x: chosen.x,
          y: chosen.y,
          gold: Math.random() < 0.2
        };
      }

      function initGame() {
        score = 0;
        comboCount = 0;
        comboTimer = 0;
        stepInterval = 120;
        particles = [];
        callouts = [];
        screenShake = 0;

        generateObstacles();

        snake = [
          { x: 5, y: 10 },
          { x: 4, y: 10 },
          { x: 3, y: 10 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };

        spawnFood();
        scoreDisplay.textContent = '0';
        comboChip.style.display = 'none';
      }

      function setDirection(dx, dy) {
        if (!isRunning || isPaused) return;
        // Prevent 180 reverse
        if (dx === -dir.x && dy === -dir.y) return;
        nextDir = { x: dx, y: dy };
        sfxTurn();
      }

      window.addEventListener('keydown', function(e) {
        if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDirection(0, -1); }
        else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDirection(0, 1); }
        else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDirection(-1, 0); }
        else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDirection(1, 0); }
        else if (e.code === 'Space' && !isRunning) { e.preventDefault(); startGame(); }
      });

      document.getElementById('btn-up').addEventListener('click', function() { setDirection(0, -1); });
      document.getElementById('btn-down').addEventListener('click', function() { setDirection(0, 1); });
      document.getElementById('btn-left').addEventListener('click', function() { setDirection(-1, 0); });
      document.getElementById('btn-right').addEventListener('click', function() { setDirection(1, 0); });

      function gameOver() {
        isRunning = false;
        screenShake = 12;
        sfxCrash();

        try {
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('dk:snake-best', String(bestScore));
            bestDisplay.textContent = bestScore;
          }
        } catch(e) {}

        try {
          window.parent.postMessage({ type: 'dk:gameover', score: score }, '*');
        } catch(e) {}

        overlayHeading.textContent = 'GAME OVER';
        overlayDesc.textContent = 'The serpent collided! Stay focused and plan ahead.';
        finalScore.textContent = score;
        finalBest.textContent = bestScore;
        statsSummary.style.display = 'grid';
        startBtn.textContent = 'PLAY AGAIN';
        overlay.classList.remove('hidden');
      }

      function startGame() {
        getAudio();
        overlay.classList.add('hidden');
        initGame();
        isRunning = true;
      }
      startBtn.addEventListener('click', startGame);

      // Devkitra messages
      window.addEventListener('message', function(e) {
        var data = e.data || {};
        if (data.type === 'dk:restart') startGame();
        else if (data.type === 'dk:pause') isPaused = true;
        else if (data.type === 'dk:resume') isPaused = false;
        else if (data.type === 'dk:resize') resize();
      });

      // Update
      function update(time) {
        if (!lastTime) lastTime = time;
        var delta = time - lastTime;
        lastTime = time;

        if (screenShake > 0) screenShake *= 0.86;
        if (screenShake < 0.1) screenShake = 0;

        if (isRunning && !isPaused) {
          if (comboTimer > 0) {
            comboTimer -= delta;
            if (comboTimer <= 0) {
              comboCount = 0;
              comboChip.style.display = 'none';
            }
          }

          stepTimer += delta;
          if (stepTimer >= stepInterval) {
            stepTimer = 0;
            dir = nextDir;

            var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            // Wall handling
            if (currentMode === 'warp') {
              if (head.x < 0) head.x = COLS - 1;
              else if (head.x >= COLS) head.x = 0;
              if (head.y < 0) head.y = ROWS - 1;
              else if (head.y >= ROWS) head.y = 0;
            } else {
              // Perimeter wall
              if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return;
              }
            }

            // Self-collision
            for (var s = 0; s < snake.length; s++) {
              if (snake[s].x === head.x && snake[s].y === head.y) {
                gameOver();
                return;
              }
            }

            // Obstacle collision
            for (var o = 0; o < obstacles.length; o++) {
              if (obstacles[o].x === head.x && obstacles[o].y === head.y) {
                gameOver();
                return;
              }
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
              comboCount++;
              comboTimer = 3500;
              comboChip.style.display = comboCount > 1 ? 'inline-block' : 'none';
              comboChip.textContent = 'Combo x' + comboCount;

              var pts = (food.gold ? 50 : 10) * Math.min(comboCount, 4);
              score += pts;
              scoreDisplay.textContent = score;

              sfxEat(food.gold);

              callouts.push({
                text: '+' + pts + (food.gold ? ' 🌟' : ''),
                x: head.x * CELL_SIZE + CELL_SIZE / 2,
                y: head.y * CELL_SIZE,
                color: food.gold ? '#facc15' : '#4ade80',
                life: 1
              });

              // Eating particles
              for (var p = 0; p < (food.gold ? 14 : 8); p++) {
                var ang = Math.random() * Math.PI * 2;
                particles.push({
                  x: head.x * CELL_SIZE + CELL_SIZE / 2,
                  y: head.y * CELL_SIZE + CELL_SIZE / 2,
                  vx: Math.cos(ang) * (Math.random() * 2.5 + 1),
                  vy: Math.sin(ang) * (Math.random() * 2.5 + 1),
                  color: food.gold ? '#facc15' : '#ef4444',
                  size: 3,
                  life: 1
                });
              }

              // Speed up slightly
              stepInterval = Math.max(70, 120 - Math.floor(score / 50) * 3);

              spawnFood();
            } else {
              snake.pop();
            }
          }
        }

        // Particles
        for (var pt = particles.length - 1; pt >= 0; pt--) {
          var pr = particles[pt];
          pr.x += pr.vx;
          pr.y += pr.vy;
          pr.life -= 0.035;
          if (pr.life <= 0) particles.splice(pt, 1);
        }

        // Callouts
        for (var cl = callouts.length - 1; cl >= 0; cl--) {
          var c = callouts[cl];
          c.y -= 0.6;
          c.life -= 0.025;
          if (c.life <= 0) callouts.splice(cl, 1);
        }
      }

      // Drawing
      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, COLS * CELL_SIZE, ROWS * CELL_SIZE);

        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        // Checkered Grass Arena
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#15803d' : '#166534';
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          }
        }

        // Obstacles
        ctx.fillStyle = '#475569';
        for (var o = 0; o < obstacles.length; o++) {
          var ob = obstacles[o];
          ctx.beginPath();
          ctx.roundRect(ob.x * CELL_SIZE + 1, ob.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2, 4);
          ctx.fill();
        }

        // Food: 3D Apple
        var fx = food.x * CELL_SIZE + CELL_SIZE / 2;
        var fy = food.y * CELL_SIZE + CELL_SIZE / 2;
        var fr = (CELL_SIZE / 2) - 2;

        ctx.fillStyle = food.gold ? '#facc15' : '#ef4444';
        ctx.beginPath();
        ctx.arc(fx, fy, fr, 0, Math.PI * 2);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(fx - fr * 0.35, fy - fr * 0.35, fr * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Apple Stem
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(fx, fy - fr);
        ctx.lineTo(fx + 2, fy - fr - 4);
        ctx.stroke();

        // Snake Body & Head
        for (var i = snake.length - 1; i >= 0; i--) {
          var seg = snake[i];
          var sx = seg.x * CELL_SIZE + CELL_SIZE / 2;
          var sy = seg.y * CELL_SIZE + CELL_SIZE / 2;
          var sr = (CELL_SIZE / 2) - 1;

          if (i === 0) {
            // Head
            var headGrad = ctx.createRadialGradient(sx - 2, sy - 2, 2, sx, sy, sr);
            headGrad.addColorStop(0, '#86efac');
            headGrad.addColorStop(1, '#22c55e');
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(sx, sy, sr + 1, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            var eyeX1 = sx + (dir.y !== 0 ? -4 : dir.x * 4);
            var eyeY1 = sy + (dir.x !== 0 ? -4 : dir.y * 4);
            var eyeX2 = sx + (dir.y !== 0 ? 4 : dir.x * 4);
            var eyeY2 = sy + (dir.x !== 0 ? 4 : dir.y * 4);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY1, 2.5, 0, Math.PI * 2);
            ctx.arc(eyeX2, eyeY2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY1, 1.2, 0, Math.PI * 2);
            ctx.arc(eyeX2, eyeY2, 1.2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Body segment
            var bodyGrad = ctx.createRadialGradient(sx, sy, 1, sx, sy, sr);
            bodyGrad.addColorStop(0, '#4ade80');
            bodyGrad.addColorStop(0.7, '#16a34a');
            bodyGrad.addColorStop(1, '#15803d');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(sx, sy, sr, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw Particles
        for (var p = 0; p < particles.length; p++) {
          var pr = particles[p];
          ctx.fillStyle = pr.color;
          ctx.beginPath();
          ctx.arc(pr.x, pr.y, pr.size * pr.life, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw Callouts
        for (var c = 0; c < callouts.length; c++) {
          var co = callouts[c];
          ctx.save();
          ctx.globalAlpha = Math.max(0, co.life);
          ctx.font = '900 16px -apple-system, sans-serif';
          ctx.fillStyle = co.color;
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 6;
          ctx.fillText(co.text, co.x, co.y);
          ctx.restore();
        }

        ctx.restore();
      }

      function loop(time) {
        update(time);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
