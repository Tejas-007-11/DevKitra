<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Snake thumbnail">
  <defs>
    <linearGradient id="snBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="snGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="snFoodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="rgba(255, 51, 102, 0)"/>
    </radialGradient>
  </defs>
  <rect width="520" height="300" rx="16" fill="url(#snBg)"/>
  <!-- Cyber grid -->
  <g stroke="#141f30" stroke-width="1" opacity="0.6">
    <path d="M40 0v300 M80 0v300 M120 0v300 M160 0v300 M200 0v300 M240 0v300 M280 0v300 M320 0v300 M360 0v300 M400 0v300 M440 0v300 M480 0v300"/>
    <path d="M0 40h520 M0 80h520 M0 120h520 M0 160h520 M0 200h520 M0 240h520 M0 280h520"/>
  </g>
  <!-- Ambient glow -->
  <circle cx="340" cy="140" r="100" fill="#00f0ff" opacity="0.08"/>
  <circle cx="410" cy="140" r="60" fill="#ff3366" opacity="0.12"/>
  <!-- Snake body path -->
  <path d="M80 140 H200 V90 H300 V140 H360" stroke="url(#snGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Snake head -->
  <rect x="350" y="128" width="24" height="24" rx="6" fill="#00f0ff"/>
  <rect x="364" y="132" width="4" height="4" rx="1" fill="#070a10"/>
  <rect x="364" y="144" width="4" height="4" rx="1" fill="#070a10"/>
  <!-- Food apple -->
  <circle cx="414" cy="140" r="22" fill="url(#snFoodGlow)"/>
  <circle cx="414" cy="140" r="10" fill="#ff3366"/>
  <!-- Title & Badge -->
  <g font-family="system-ui, sans-serif" font-weight="900">
    <text x="44" y="54" fill="#00f0ff" font-size="24" letter-spacing="-0.03em">CYBER SNAKE</text>
    <rect x="44" y="68" width="68" height="20" rx="4" fill="rgba(0,240,255,0.14)" stroke="rgba(0,240,255,0.3)"/>
    <text x="78" y="82" fill="#00f0ff" font-size="10" text-anchor="middle" font-weight="800">ARCADE</text>
  </g>
</svg>
