<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="nb-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="laser-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="enemy-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="enemy-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="enemy-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-crimson" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Circular Arena Background -->
  <rect width="600" height="400" fill="url(#nb-bg)"/>

  <!-- Radar / Arena Range Concentric Rings -->
  <g fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5">
    <circle cx="300" cy="180" r="70"/>
    <circle cx="300" cy="180" r="130" stroke-dasharray="6,8"/>
    <circle cx="300" cy="180" r="190"/>
    <circle cx="300" cy="180" r="250" stroke-dasharray="4,10"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="60" y1="180" x2="540" y2="180"/>
    <line x1="120" y1="40" x2="480" y2="320"/>
    <line x1="120" y1="320" x2="480" y2="40"/>
  </g>

  <!-- Orbital Defensive Shield Segments -->
  <g fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow-cyan)">
    <path d="M 255 135 A 64 64 0 0 1 345 135"/>
    <path d="M 345 225 A 64 64 0 0 1 255 225"/>
    <circle cx="300" cy="180" r="64" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="8,6"/>
  </g>

  <!-- High-Energy Projectile Laser Beams -->
  <g stroke="url(#laser-cyan)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow-cyan)">
    <!-- Main Stream Top-Right -->
    <line x1="300" y1="180" x2="440" y2="80"/>
    <line x1="310" y1="172" x2="450" y2="72"/>
    <line x1="290" y1="188" x2="430" y2="88"/>
    <!-- Peripheral Defense Bolts -->
    <line x1="300" y1="180" x2="160" y2="100"/>
    <line x1="300" y1="180" x2="190" y2="280"/>
    <line x1="300" y1="180" x2="430" y2="270"/>
  </g>

  <!-- Projectile Impact Particle Sparks -->
  <g fill="#38bdf8" filter="url(#glow-cyan)">
    <circle cx="445" cy="76" r="4"/>
    <circle cx="452" cy="72" r="2.5"/>
    <circle cx="438" cy="82" r="3"/>
    <circle cx="155" cy="98" r="3.5"/>
    <circle cx="185" cy="285" r="3.5"/>
  </g>

  <!-- Central Energy Core & Dual Turret Cannons -->
  <g transform="translate(300, 180)">
    <!-- Outer Core Housing -->
    <circle r="36" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Glowing Core -->
    <circle r="26" fill="url(#core-glow)" filter="url(#glow-core)"/>
    <!-- Rotating Turret Base -->
    <g transform="rotate(-35)">
      <!-- Dual Laser Cannons -->
      <rect x="12" y="-9" width="30" height="6" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="12" y="3" width="30" height="6" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Muzzle Flares -->
      <circle cx="42" cy="-6" r="5" fill="#ffffff" filter="url(#glow-cyan)"/>
      <circle cx="42" cy="6" r="5" fill="#ffffff" filter="url(#glow-cyan)"/>
      <!-- Central Turret Pivot -->
      <circle r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <circle r="5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- GEOMETRIC ENEMIES -->
  <!-- 1. Tank: Armored Hexagon (Top-Right under fire) -->
  <g transform="translate(460, 70)">
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#glow-cyan)"/>
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="url(#enemy-purple)"/>
    <!-- Armor Shell -->
    <circle r="6" fill="#ffffff"/>
  </g>

  <!-- 2. Sprinter: Fast Neon Arrow (Top-Left) -->
  <g transform="translate(140, 90) rotate(45)">
    <polygon points="0,-18 14,14 0,8 -14,14" fill="url(#enemy-amber)"/>
    <polygon points="0,-22 18,18 0,10 -18,18" fill="none" stroke="#fef08a" stroke-width="2"/>
  </g>

  <!-- 3. Bomber: Crimson Warning Triangle (Bottom-Left) -->
  <g transform="translate(170, 290) rotate(-45)">
    <polygon points="0,-20 18,14 -18,14" fill="url(#enemy-crimson)" filter="url(#glow-crimson)"/>
    <circle r="5" fill="#ffffff"/>
    <circle r="26" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 4. Drifter: Cyan Geometric Diamond (Bottom-Right) -->
  <g transform="translate(450, 280) rotate(-135)">
    <polygon points="0,-18 14,0 0,18 -14,0" fill="#06b6d4" stroke="#e0f2fe" stroke-width="2"/>
    <circle r="4" fill="#ffffff"/>
  </g>

  <!-- 5. Zigzag: Neon Emerald Chevron (Far Right) -->
  <g transform="translate(510, 180) rotate(180)">
    <polygon points="0,-14 16,0 0,14 6,0" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
  </g>

  <!-- Sleek Bottom Title & Tagline Plaque -->
  <rect x="110" y="325" width="380" height="54" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  <text x="300" y="352" text-anchor="middle" dominant-baseline="central" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="4">NEON BASTION</text>
  <text x="300" y="368" text-anchor="middle" dominant-baseline="central" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="2">2D ARCADE SURVIVAL SHOOTER</text>
</svg>
