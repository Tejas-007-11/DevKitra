<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- 3D Perspective Track Lines -->
  <polygon points="120,300 280,300 230,120 170,120" fill="url(#track)" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="120" x2="200" y2="300" stroke="rgba(56, 189, 248, 0.4)" stroke-dasharray="8 8" stroke-width="2"/>

  <!-- Horizon Glow -->
  <ellipse cx="200" cy="120" rx="90" ry="12" fill="rgba(56, 189, 248, 0.2)" filter="url(#glow)"/>

  <!-- Distant Obstacles -->
  <polygon points="185,145 205,145 208,135 188,135" fill="#ef4444" opacity="0.8"/>
  <polygon points="215,190 240,190 244,175 219,175" fill="#ef4444" filter="url(#glow)"/>

  <!-- 3D Floating Gem -->
  <polygon points="160,200 170,185 180,200 170,215" fill="#10b981" filter="url(#glow)"/>
  <polygon points="160,200 170,185 170,215" fill="#34d399"/>

  <!-- Rolling 3D Sphere -->
  <ellipse cx="195" cy="255" rx="36" ry="12" fill="rgba(0,0,0,0.6)"/>
  <circle cx="195" cy="235" r="32" fill="url(#ball)" filter="url(#glow)"/>
  <ellipse cx="185" cy="225" rx="14" ry="8" fill="#bae6fd" opacity="0.6"/>

  <!-- Speed Lines -->
  <line x1="60" y1="80" x2="110" y2="160" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="340" y1="80" x2="290" y2="160" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="180" x2="80" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <line x1="360" y1="180" x2="320" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Badge / Title -->
  <rect x="24" y="24" width="130" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1"/>
  <text x="89" y="42" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">3D VELOCITY</text>
</svg>

