<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tetris-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
  </defs>

  <!-- Clean Arcade Grid Background -->
  <rect width="600" height="400" fill="url(#tetris-bg)"/>

  <!-- Subtle Matrix Grid -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="420" y1="0" x2="420" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="260" x2="600" y2="260"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
  </g>

  <!-- T-Piece (Purple) -->
  <g fill="#c084fc" stroke="#a855f7" stroke-width="3">
    <rect x="250" y="70" width="56" height="56" rx="6"/>
    <rect x="190" y="130" width="56" height="56" rx="6"/>
    <rect x="250" y="130" width="56" height="56" rx="6"/>
    <rect x="310" y="130" width="56" height="56" rx="6"/>
  </g>

  <!-- O-Piece (Yellow Square, Base) -->
  <g fill="#facc15" stroke="#eab308" stroke-width="3">
    <rect x="190" y="270" width="56" height="56" rx="6"/>
    <rect x="250" y="270" width="56" height="56" rx="6"/>
    <rect x="190" y="330" width="56" height="56" rx="6"/>
    <rect x="250" y="330" width="56" height="56" rx="6"/>
  </g>

  <!-- I-Piece (Cyan Long Bar) -->
  <g fill="#38bdf8" stroke="#0ea5e9" stroke-width="3">
    <rect x="370" y="150" width="56" height="56" rx="6"/>
    <rect x="370" y="210" width="56" height="56" rx="6"/>
    <rect x="370" y="270" width="56" height="56" rx="6"/>
    <rect x="370" y="330" width="56" height="56" rx="6"/>
  </g>

  <!-- L-Piece (Orange) -->
  <g fill="#fb923c" stroke="#f97316" stroke-width="3">
    <rect x="430" y="210" width="56" height="56" rx="6"/>
    <rect x="430" y="270" width="56" height="56" rx="6"/>
    <rect x="430" y="330" width="56" height="56" rx="6"/>
    <rect x="490" y="330" width="56" height="56" rx="6"/>
  </g>

  <!-- S-Piece (Green) -->
  <g fill="#4ade80" stroke="#22c55e" stroke-width="3">
    <rect x="130" y="330" width="56" height="56" rx="6"/>
    <rect x="70" y="330" width="56" height="56" rx="6"/>
    <rect x="130" y="270" width="56" height="56" rx="6"/>
  </g>

  <!-- Score Line Clear Badge -->
  <g transform="translate(300, 35)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(24, 27, 34, 0.9)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#38bdf8" letter-spacing="2">BLOCK DROP</text>
  </g>
</svg>
