<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="pol-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="flux-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="flux-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="node-cyan" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="node-magenta" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="orb-metal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-magenta" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#pol-bg)"/>

  <!-- Subtle Coordinate Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="420" y1="0" x2="420" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="540" y1="0" x2="540" y2="400"/>
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
  </g>

  <!-- Curved Magnetic Field Lines (Dipole Flux) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 120 180 C 180 80, 240 80, 300 180" stroke="rgba(6, 182, 212, 0.35)" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 120 180 C 160 40, 260 40, 300 180" stroke="rgba(6, 182, 212, 0.22)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <path d="M 120 180 C 180 280, 240 280, 300 180" stroke="rgba(6, 182, 212, 0.35)" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 120 180 C 160 320, 260 320, 300 180" stroke="rgba(6, 182, 212, 0.22)" stroke-width="1.5" stroke-dasharray="6,4"/>

    <path d="M 300 180 C 360 80, 420 80, 480 180" stroke="rgba(244, 63, 94, 0.35)" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 300 180 C 340 40, 440 40, 480 180" stroke="rgba(244, 63, 94, 0.22)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <path d="M 300 180 C 360 280, 420 280, 480 180" stroke="rgba(244, 63, 94, 0.35)" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 300 180 C 340 320, 440 320, 480 180" stroke="rgba(244, 63, 94, 0.22)" stroke-width="1.5" stroke-dasharray="6,4"/>
  </g>

  <!-- Left Magnetic Node (Attract - Cyan N) -->
  <g transform="translate(120, 180)">
    <circle r="44" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2"/>
    <circle r="36" fill="none" stroke="rgba(6, 182, 212, 0.45)" stroke-width="2"/>
    <circle r="26" fill="url(#node-cyan)" filter="url(#glow-cyan)"/>
    <text text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="20">N</text>
    <text y="42" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1">ATTRACT</text>
  </g>

  <!-- Right Magnetic Node (Repel - Magenta S) -->
  <g transform="translate(480, 180)">
    <circle r="44" fill="none" stroke="rgba(244, 63, 94, 0.25)" stroke-width="2"/>
    <circle r="36" fill="none" stroke="rgba(244, 63, 94, 0.45)" stroke-width="2"/>
    <circle r="26" fill="url(#node-magenta)" filter="url(#glow-magenta)"/>
    <text text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="20">S</text>
    <text y="42" text-anchor="middle" fill="#fb7185" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1">REPEL</text>
  </g>

  <!-- Energy Orbs / Pickups -->
  <g transform="translate(210, 100)">
    <circle r="12" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle r="6" fill="#fde047" filter="url(#glow-cyan)"/>
  </g>
  <g transform="translate(390, 260)">
    <circle r="12" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle r="6" fill="#fde047" filter="url(#glow-cyan)"/>
  </g>

  <!-- Exit Portal in Background -->
  <g transform="translate(530, 80)">
    <circle r="26" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="4" stroke-dasharray="8,6"/>
    <circle r="18" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle r="10" fill="#34d399"/>
  </g>

  <!-- Motion Trail Ribbon -->
  <path d="M 180 230 Q 230 200, 300 180" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 230 200 Q 265 190, 300 180" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Controllable Metal Orb -->
  <g transform="translate(300, 180)">
    <!-- Outer Dual-Polarity Halo -->
    <circle r="34" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.8" filter="url(#glow-cyan)"/>
    <circle r="28" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="10,6" opacity="0.9"/>
    <!-- Metallic Sphere Body -->
    <circle r="20" fill="url(#orb-metal)"/>
    <!-- Specular Highlight -->
    <circle cx="-6" cy="-6" r="6" fill="#ffffff" opacity="0.85"/>
    <!-- Core Status LED -->
    <circle r="4" fill="#38bdf8" filter="url(#glow-cyan)"/>
  </g>

  <!-- Bottom Brand Title Banner -->
  <rect x="120" y="325" width="360" height="52" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <text x="300" y="352" text-anchor="middle" dominant-baseline="central" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="4">POLARITY</text>
  <text x="300" y="367" text-anchor="middle" dominant-baseline="central" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="600" font-size="9" letter-spacing="2">MAGNETIC ARCADE PUZZLE</text>
</svg>
