<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reaction Test — DevKitra Gaming</title>
<meta name="description" content="Wait for the screen to turn green, then tap as fast as you can. Play Reaction Test instantly in your browser." />
<link rel="canonical" href="https://devkitra.in/game/reaction-test" />
<style>
* { box-sizing: border-box; }
:root {
  --ink: #0b0d11;
  --panel: #10141c;
  --line: #1f2939;
  --text: #e8edf4;
  --muted: #8a93a1;
  --accent: #5b4bff;
  --good: #4ade80;
  --bad: #f87171;
}
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
header { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.5rem 0 1rem; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.1rem; letter-spacing: -0.02em; font-weight: 700; }
a.back { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
a.back:hover { color: var(--text); }
#wrap { max-width: 420px; width: 100%; border-radius: 12px; padding: 0.5rem; background: var(--panel); border: 1px solid var(--line); }
.status { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; text-align: center; font-variant-numeric: tabular-nums; }
.status b { color: var(--text); }
#zone { width: 100%; height: 260px; border-radius: 16px; border: 2px solid var(--line); background: var(--bad); position: relative; overflow: hidden; cursor: pointer; touch-action: none; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; transition: background 0.05s; }
#zone.waiting { background: var(--bad); }
#zone.ready { background: var(--good); border-color: var(--good); }
.overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(11, 13, 17, 0.85); border-radius: 14px; z-index: 10; text-align: center; }
.overlay h2 { margin: 0 0 0.5rem; font-size: 1.5rem; }
.overlay p { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 0.6rem 1.2rem; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
.btn:hover { background: #4736e8; }
.stats { margin-top: 1rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; text-align: center; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem; background: #131823; }
.stat b { display: block; font-size: 1.1rem; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.stat span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
@media (max-width: 420px) { header { padding: 0.5rem 0 0.75rem; } }
</style>
</head>
<body>
<header>
  <h1>Reaction Test</h1>
  <a class="back" href="/game/reaction-test">← Library</a>
</header>
<div id="wrap">
  <div class="status">Reaction time <b id="last">--</b> ms <span style="opacity:0.4">·</span> Best <b id="best">--</b> ms <span style="opacity:0.4">·</span> Average <b id="avg">--</b> ms</div>
  <div id="zone" class="waiting" role="button" aria-label="Tap when green">Wait for green</div>
  <div id="too-early" class="overlay">
    <h2>Too early!</h2>
    <p>You tapped before the screen turned green.</p>
    <button class="btn" id="early-btn">Try again</button>
  </div>
  <div id="result" class="overlay">
    <h2 id="result-title">Nice!</h2>
    <p id="result-text">Reaction time <b id="result-time">0</b> ms</p>
    <button class="btn" id="again-btn">Try again</button>
  </div>
  <div id="pause" class="overlay">
    <h2>Paused</h2>
    <p>Resume to continue.</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="hist-count">0</b><span>plays</span></div>
    <div class="stat"><b id="hist-best">--</b><span>best</span></div>
    <div class="stat"><b id="hist-avg">--</b><span>average</span></div>
  </div>
</div>
<script>
const zone = document.getElementById('zone');
const lastEl = document.getElementById('last');
const bestEl = document.getElementById('best');
const avgEl = document.getElementById('avg');
const earlyEl = document.getElementById('too-early');
const resultEl = document.getElementById('result');
const resultTitle = document.getElementById('result-title');
const resultText = document.getElementById('result-text');
const resultTimeEl = document.getElementById('result-time');
let best = Number(localStorage.getItem('dk:reaction-best') || 0);
bestEl.textContent = best || '--';
let history = [];
let state = 'idle'; // idle | waiting | ready
let startTime = 0;
let timerId = null;
let paused = false;
let prevState = 'idle';

const embed = new URLSearchParams(window.location.search).has('embed');
if (embed) { document.querySelector('header')?.remove(); document.getElementById('wrap').style.padding = '0.5rem'; }

function post(payload) {
  if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
}
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'dk:restart') { resetUI(); paused = false; }
  if (event.data && event.data.type === 'dk:pause') pauseGame();
  if (event.data && event.data.type === 'dk:resume') resumeGame();
});

function updateStats() {
  const count = history.length;
  document.getElementById('hist-count').textContent = count;
  document.getElementById('hist-best').textContent = best || '--';
  const avg = count ? Math.round(history.reduce((a, b) => a + b, 0) / count) : 0;
  document.getElementById('hist-avg').textContent = count ? avg + ' ms' : '--';
  avgEl.textContent = count ? avg + ' ms' : '--';
}

function resetUI() {
  clearTimeout(timerId);
  state = 'idle';
  zone.className = 'waiting';
  zone.textContent = 'Wait for green';
  lastEl.textContent = '--';
  earlyEl.style.display = 'none';
  resultEl.style.display = 'none';
  updateStats();
  post({ type: 'dk:ready', id: 'reaction-test', title: 'Reaction Test' });
}

function startRound() {
  state = 'waiting';
  zone.className = 'waiting';
  zone.textContent = 'Wait for green';
  earlyEl.style.display = 'none';
  resultEl.style.display = 'none';
  const delay = 1200 + Math.random() * 2300;
  timerId = setTimeout(() => {
    if (state !== 'waiting') return;
    state = 'ready';
    zone.className = 'ready';
    zone.textContent = 'Tap now!';
    startTime = performance.now();
  }, delay);
}

function endTooEarly() {
  clearTimeout(timerId);
  state = 'idle';
  zone.className = 'waiting';
  zone.textContent = 'Wait for green';
  earlyEl.style.display = 'flex';
}

function finishReaction() {
  const ms = Math.round(performance.now() - startTime);
  history.push(ms);
  if (!best || ms < best) { best = ms; try { localStorage.setItem('dk:reaction-best', String(best)); } catch (_) {} bestEl.textContent = best; }
  lastEl.textContent = ms + ' ms';
  bestEl.textContent = best + ' ms';
  avgEl.textContent = Math.round(history.reduce((a, b) => a + b, 0) / history.length) + ' ms';
  updateStats();
  state = 'idle';
  zone.className = 'waiting';
  zone.textContent = 'Wait for green';
  resultTitle.textContent = ms < 250 ? 'Excellent!' : ms < 400 ? 'Nice!' : 'Not bad!';
  resultText.textContent = 'Reaction time';
  resultTimeEl.textContent = ms + ' ms';
  resultEl.style.display = 'flex';
  post({ type: 'dk:gameover', score: ms });
}

function pauseGame() {
  if (state === 'paused' || state === 'idle') return;
  paused = true;
  prevState = state;
  state = 'paused';
  clearTimeout(timerId);
  document.getElementById('pause').style.display = 'flex';
}

function resumeGame() {
  if (!paused) return;
  paused = false;
  document.getElementById('pause').style.display = 'none';
  const was = prevState;
  prevState = 'idle';
  if (was === 'waiting') {
    state = 'idle';
    zone.className = 'waiting';
    zone.textContent = 'Wait for green';
  } else {
    state = was;
  }
}

function attempt() {
  if (paused) return;
  if (state === 'waiting') { endTooEarly(); return; }
  if (state === 'ready') { finishReaction(); return; }
  if (state === 'idle') { startRound(); }
}

zone.addEventListener('click', attempt);
zone.addEventListener('touchstart', (event) => { event.preventDefault(); attempt(); }, { passive: false });
window.addEventListener('keydown', (event) => { if (event.code === 'Space' || event.code === 'Enter') { event.preventDefault(); attempt(); } });
document.getElementById('early-btn').addEventListener('click', startRound);
document.getElementById('again-btn').addEventListener('click', startRound);

resetUI();
post({ type: 'dk:ready', id: 'reaction-test', title: 'Reaction Test' });
</script>
</body>
</html>
