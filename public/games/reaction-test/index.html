<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Reaction Benchmark — Devkitra Gaming</title>
  <meta name="description" content="Test your click & touch reflex speed in milliseconds with precision timer benchmarks." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    :root {
      --bg: #07090e;
      --cyan: #00f0ff;
      --good: #10b981;
      --good-glow: rgba(16, 185, 129, 0.45);
      --bad: #ef4444;
      --bad-glow: rgba(239, 68, 68, 0.45);
      --amber: #f59e0b;
      --purple: #8b5cf6;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .hud-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .hud-chip {
      background: rgba(13, 18, 28, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.05em;
    }
    .hud-chip b {
      color: var(--cyan);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 17px;
    }
    .hud-chip.best b {
      color: #f59e0b;
    }

    #arena {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.1s cubic-bezier(0, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0, 0, 0.2, 1);
      position: relative;
      text-align: center;
      padding: 24px;
    }

    /* Arena States */
    #arena.idle {
      background: radial-gradient(circle at center, #101929 0%, #07090e 70%);
      border: 2px solid #1e293b;
    }
    #arena.waiting {
      background: radial-gradient(circle at center, #2e0914 0%, #150308 70%);
      box-shadow: inset 0 0 100px var(--bad-glow);
      border: 2px solid var(--bad);
    }
    #arena.ready {
      background: radial-gradient(circle at center, #063d27 0%, #022014 70%);
      box-shadow: inset 0 0 140px var(--good-glow);
      border: 2px solid var(--good);
    }
    #arena.early {
      background: radial-gradient(circle at center, #3b0714 0%, #170408 70%);
      box-shadow: inset 0 0 120px var(--bad-glow);
      border: 2px solid var(--bad);
    }
    #arena.result {
      background: radial-gradient(circle at center, #0e1e36 0%, #070b14 70%);
      border: 2px solid rgba(0, 240, 255, 0.3);
    }

    .pulse-ring {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      animation: pulseAnim 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(3.2); opacity: 0; }
    }

    .state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }
    .state-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #ffffff;
      pointer-events: none;
    }
    .state-desc {
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      max-width: 380px;
      line-height: 1.5;
      pointer-events: none;
    }

    /* Rank Pill */
    .rank-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
      pointer-events: none;
    }
    .rank-godlike { background: rgba(0, 240, 255, 0.18); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.5); }
    .rank-esports { background: rgba(139, 92, 246, 0.18); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.5); }
    .rank-pro { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
    .rank-avg { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.5); }
    .rank-slow { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }

    .score-big {
      font-size: 72px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--cyan);
      text-shadow: 0 0 24px rgba(0, 240, 255, 0.4);
      margin-bottom: 6px;
      pointer-events: none;
    }
    .score-unit {
      font-size: 22px;
      color: #94a3b8;
      font-weight: 700;
      pointer-events: none;
    }

    .bottom-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .chart-strip {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 48px;
      max-width: 440px;
      width: 100%;
      background: rgba(13, 18, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .chart-bar {
      flex: 1;
      min-height: 4px;
      border-radius: 4px 4px 0 0;
      transition: height 0.3s ease;
    }
    .retry-tip {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div class="hud-bar">
      <div class="hud-chip">ROUND <b id="round-val">0</b></div>
      <div class="hud-chip">AVG <b id="avg-val">--</b></div>
      <div class="hud-chip best">RECORD <b id="best-val">--</b></div>
    </div>

    <div id="arena" class="idle">
      <div class="pulse-ring" id="ring"></div>
      <div class="state-icon" id="icon">⚡</div>
      <div class="rank-pill hidden" id="rank-badge">PRO GAMER</div>
      <div class="score-big hidden" id="time-display">210<span class="score-unit">ms</span></div>
      <div class="state-title" id="title">TAP TO START</div>
      <div class="state-desc" id="desc">Wait for the screen to turn vibrant green, then tap or click as fast as humanly possible.</div>
    </div>

    <div class="bottom-panel">
      <div class="chart-strip" id="chart"></div>
      <div class="retry-tip" id="tip">Tap screen or Spacebar to interact</div>
    </div>
  </div>

  <script>
    (function () {
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (_) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSound(type) {
        const actx = getAudio();
        if (!actx) return;
        try {
          const now = actx.currentTime;
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.connect(gain);
          gain.connect(actx.destination);

          if (type === 'wait') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.0001, now + 0.06);
            osc.start(now);
            osc.stop(now + 0.06);
          } else if (type === 'signal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.0001, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
          } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(1080, now + 0.16);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
            osc.start(now);
            osc.stop(now + 0.16);
          } else if (type === 'early') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.0001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          }
        } catch (_) {}
      }

      const arena = document.getElementById('arena');
      const ring = document.getElementById('ring');
      const icon = document.getElementById('icon');
      const title = document.getElementById('title');
      const desc = document.getElementById('desc');
      const timeDisplay = document.getElementById('time-display');
      const rankBadge = document.getElementById('rank-badge');
      const chart = document.getElementById('chart');
      const tip = document.getElementById('tip');

      const roundVal = document.getElementById('round-val');
      const avgVal = document.getElementById('avg-val');
      const bestVal = document.getElementById('best-val');

      let state = 'idle'; // 'idle' | 'waiting' | 'ready' | 'result' | 'early'
      let timer = null;
      let startTime = 0;
      let history = [];
      let best = Number(localStorage.getItem('dk:reaction-best') || 0);

      if (best > 0) {
        bestVal.textContent = `${best}ms`;
      }

      function post(payload) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      }

      window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.type === 'dk:restart') toIdle();
        if (event.data.type === 'dk:keydown') {
          if (event.data.code === 'Space' || event.data.code === 'Enter') {
            handleInteraction();
          }
        }
      });

      function updateChart() {
        chart.innerHTML = '';
        const recent = history.slice(-12);
        const maxVal = Math.max(450, ...recent);
        recent.forEach((ms) => {
          const bar = document.createElement('div');
          bar.className = 'chart-bar';
          const pct = Math.max(12, Math.min(100, (ms / maxVal) * 100));
          bar.style.height = `${pct}%`;
          bar.style.background = ms < 200 ? '#00f0ff' : ms < 270 ? '#10b981' : ms < 360 ? '#f59e0b' : '#ef4444';
          chart.appendChild(bar);
        });
      }

      function toIdle() {
        clearTimeout(timer);
        state = 'idle';
        arena.className = 'idle';
        ring.style.display = 'block';
        ring.style.borderColor = 'rgba(0, 240, 255, 0.3)';
        icon.textContent = '⚡';
        timeDisplay.style.display = 'none';
        rankBadge.style.display = 'none';
        title.textContent = 'TAP TO START';
        desc.textContent = 'Wait for the screen to turn vibrant green, then tap or click as fast as humanly possible.';
        tip.textContent = 'Tap anywhere to begin';
        post({ type: 'dk:ready', id: 'reaction-test', title: 'Reaction Benchmark' });
      }

      function toWaiting() {
        clearTimeout(timer);
        state = 'waiting';
        arena.className = 'waiting';
        ring.style.display = 'block';
        ring.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        icon.textContent = '🔴';
        timeDisplay.style.display = 'none';
        rankBadge.style.display = 'none';
        title.textContent = 'WAIT FOR GREEN...';
        desc.textContent = 'Focus your eyes and finger. Tap the instant green erupts!';
        tip.textContent = 'Do not tap yet!';
        playSound('wait');

        // Random delay between 1.5s and 4.2s
        const delay = 1500 + Math.random() * 2700;
        timer = setTimeout(toReady, delay);
      }

      function toReady() {
        state = 'ready';
        arena.className = 'ready';
        ring.style.display = 'none';
        icon.textContent = '🟢';
        title.textContent = 'TAP NOW!';
        desc.textContent = 'FIRE! Click or tap the screen immediately!';
        tip.textContent = 'CLICK NOW!';
        playSound('signal');
        startTime = performance.now();
      }

      function toEarly() {
        clearTimeout(timer);
        state = 'early';
        arena.className = 'early';
        ring.style.display = 'none';
        icon.textContent = '⚠️';
        timeDisplay.style.display = 'none';
        rankBadge.style.display = 'none';
        title.textContent = 'TOO EARLY!';
        desc.textContent = 'You jumped before the signal turned green. Wait for the green flash!';
        tip.textContent = 'Tap anywhere to try again';
        playSound('early');
      }

      function toResult(reactionMs) {
        state = 'result';
        arena.className = 'result';
        ring.style.display = 'none';
        playSound('success');

        history.push(reactionMs);
        roundVal.textContent = history.length;
        const avg = Math.round(history.reduce((a, b) => a + b, 0) / history.length);
        avgVal.textContent = `${avg}ms`;

        if (!best || reactionMs < best) {
          best = reactionMs;
          try { localStorage.setItem('dk:reaction-best', String(best)); } catch (_) {}
          bestVal.textContent = `${best}ms`;
        }

        timeDisplay.innerHTML = `${reactionMs}<span class="score-unit">ms</span>`;
        timeDisplay.style.display = 'block';

        // Calculate Rank Tier
        rankBadge.style.display = 'inline-flex';
        if (reactionMs < 190) {
          rankBadge.className = 'rank-pill rank-godlike';
          rankBadge.textContent = '⚡ GODLIKE (Top 1%)';
          icon.textContent = '👑';
        } else if (reactionMs < 240) {
          rankBadge.className = 'rank-pill rank-esports';
          rankBadge.textContent = '🎯 ESPORTS PRO (Top 10%)';
          icon.textContent = '🚀';
        } else if (reactionMs < 290) {
          rankBadge.className = 'rank-pill rank-pro';
          rankBadge.textContent = '✨ FAST REFLEX';
          icon.textContent = '⚡';
        } else if (reactionMs < 370) {
          rankBadge.className = 'rank-pill rank-avg';
          rankBadge.textContent = '👍 AVERAGE HUMAN';
          icon.textContent = '⏱️';
        } else {
          rankBadge.className = 'rank-pill rank-slow';
          rankBadge.textContent = '🐢 RELAXED REFLEX';
          icon.textContent = '💤';
        }

        title.textContent = 'PERFECT REACTION!';
        desc.textContent = 'Round registered. Tap anywhere to take the test again.';
        tip.textContent = 'Tap anywhere for Next Round';

        updateChart();
        post({ type: 'dk:score', score: reactionMs });
      }

      function handleInteraction(e) {
        if (e) e.preventDefault();

        if (state === 'idle' || state === 'result' || state === 'early') {
          toWaiting();
        } else if (state === 'waiting') {
          toEarly();
        } else if (state === 'ready') {
          const delta = Math.round(performance.now() - startTime);
          toResult(delta);
        }
      }

      arena.addEventListener('pointerdown', handleInteraction);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          handleInteraction();
        }
      });

      toIdle();
    })();
  </script>
</body>
</html>
