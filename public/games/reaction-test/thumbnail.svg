<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Reaction Test thumbnail">
  <defs>
    <linearGradient id="rtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071816"/>
      <stop offset="100%" stop-color="#05090f"/>
    </linearGradient>
    <radialGradient id="rtGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)"/>
    </radialGradient>
  </defs>
  <rect width="520" height="300" rx="16" fill="url(#rtBg)"/>
  <!-- Radar rings -->
  <circle cx="340" cy="150" r="110" fill="none" stroke="#1c3830" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="340" cy="150" r="75" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <circle cx="340" cy="150" r="45" fill="url(#rtGreenGlow)"/>
  <circle cx="340" cy="150" r="32" fill="#10b981"/>
  <text x="340" y="157" fill="#07090e" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">REACT</text>
  <!-- Latency stat display -->
  <g transform="translate(44, 45)" font-family="ui-monospace, monospace">
    <rect x="0" y="0" width="130" height="38" rx="8" fill="#0f1922" stroke="#1c2c3b"/>
    <text x="65" y="24" fill="#00f0ff" font-size="18" font-weight="800" text-anchor="middle">198 ms</text>
    <rect x="0" y="48" width="130" height="24" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.3)"/>
    <text x="65" y="64" fill="#00f0ff" font-size="10" font-weight="800" text-anchor="middle">⚡ GODLIKE</text>
  </g>
  <!-- Title & Badge -->
  <g font-family="system-ui, sans-serif" font-weight="900">
    <text x="44" y="160" fill="#10b981" font-size="24" letter-spacing="-0.03em">REACTION</text>
    <text x="44" y="186" fill="#10b981" font-size="24" letter-spacing="-0.03em">TEST</text>
    <rect x="44" y="202" width="90" height="20" rx="4" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.3)"/>
    <text x="89" y="216" fill="#10b981" font-size="10" text-anchor="middle" font-weight="800">QUICK PLAY</text>
  </g>
</svg>
