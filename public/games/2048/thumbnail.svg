<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="2048 thumbnail">
  <defs>
    <linearGradient id="t2048Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140f06"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
  </defs>
  <rect width="520" height="300" rx="16" fill="url(#t2048Bg)"/>
  <!-- Ambient glow -->
  <circle cx="340" cy="150" r="100" fill="#f59e0b" opacity="0.12"/>
  <!-- 2048 Board Mockup -->
  <g transform="translate(180, 40)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#0c121d" stroke="#1c2638" stroke-width="2"/>
    <!-- Tiles -->
    <rect x="15" y="15" width="60" height="60" rx="8" fill="#172235"/>
    <text x="45" y="52" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="22" font-weight="900" text-anchor="middle">2</text>

    <rect x="85" y="15" width="60" height="60" rx="8" fill="#1e293b"/>
    <text x="115" y="52" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="22" font-weight="900" text-anchor="middle">4</text>

    <rect x="155" y="15" width="60" height="60" rx="8" fill="#b45309"/>
    <text x="185" y="52" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="22" font-weight="900" text-anchor="middle">8</text>

    <rect x="225" y="15" width="60" height="60" rx="8" fill="#c2410c"/>
    <text x="255" y="52" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="20" font-weight="900" text-anchor="middle">16</text>

    <!-- Row 2 -->
    <rect x="15" y="85" width="60" height="60" rx="8" fill="#be123c"/>
    <text x="45" y="122" fill="#ffe4e6" font-family="ui-monospace, monospace" font-size="20" font-weight="900" text-anchor="middle">32</text>

    <rect x="85" y="85" width="60" height="60" rx="8" fill="#7c3aed"/>
    <text x="115" y="122" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="20" font-weight="900" text-anchor="middle">64</text>

    <rect x="155" y="85" width="60" height="60" rx="8" fill="#0284c7"/>
    <text x="185" y="122" fill="#f0f9ff" font-family="ui-monospace, monospace" font-size="18" font-weight="900" text-anchor="middle">128</text>

    <rect x="225" y="85" width="60" height="60" rx="8" fill="#0d9488"/>
    <text x="255" y="122" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="18" font-weight="900" text-anchor="middle">256</text>

    <!-- Big 2048 tile -->
    <rect x="15" y="155" width="130" height="52" rx="8" fill="#ec4899" stroke="#fbcfe8" stroke-width="2"/>
    <text x="80" y="190" fill="#ffffff" font-family="ui-monospace, monospace" font-size="26" font-weight="900" text-anchor="middle">2048</text>

    <rect x="155" y="155" width="60" height="52" rx="8" fill="#eab308"/>
    <text x="185" y="189" fill="#07090e" font-family="ui-monospace, monospace" font-size="18" font-weight="900" text-anchor="middle">512</text>

    <rect x="225" y="155" width="60" height="52" rx="8" fill="#06b6d4"/>
    <text x="255" y="189" fill="#07090e" font-family="ui-monospace, monospace" font-size="16" font-weight="900" text-anchor="middle">1024</text>
  </g>
  <!-- Title & Badge -->
  <g font-family="system-ui, sans-serif" font-weight="900">
    <text x="36" y="110" fill="#f59e0b" font-size="34" letter-spacing="-0.03em">2048</text>
    <rect x="36" y="126" width="68" height="20" rx="4" fill="rgba(245,158,11,0.14)" stroke="rgba(245,158,11,0.3)"/>
    <text x="70" y="140" fill="#f59e0b" font-size="10" text-anchor="middle" font-weight="800">PUZZLE</text>
  </g>
</svg>
