<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Outdoor Target Range Background -->
  <rect width="600" height="400" fill="url(#arch-bg)"/>

  <!-- Target Stand (Right side) -->
  <rect x="440" y="160" width="14" height="200" fill="#78350f"/>

  <!-- Target Bullseye -->
  <circle cx="447" cy="160" r="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="447" cy="160" r="62" fill="#3b82f6"/>
  <circle cx="447" cy="160" r="38" fill="#ef4444"/>
  <circle cx="447" cy="160" r="15" fill="#facc15"/>

  <!-- Bullseye Hit Arrow sticking out! -->
  <line x1="280" y1="120" x2="447" y2="160" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
  <!-- Feathers on arrow -->
  <polygon points="280,120 270,110 260,115 272,123" fill="#ef4444"/>

  <!-- Colorful Floating Balloons -->
  <circle cx="340" cy="90" r="24" fill="#f43f5e"/>
  <line x1="340" y1="114" x2="340" y2="135" stroke="#64748b" stroke-width="2"/>

  <circle cx="280" cy="190" r="22" fill="#3b82f6"/>
  <line x1="280" y1="212" x2="280" y2="230" stroke="#64748b" stroke-width="2"/>

  <!-- Archer Bow & Avatar (Left Side) -->
  <g transform="translate(100, 220)">
    <!-- Wooden Bow -->
    <path d="M 12 -45 Q 40 0 12 45" fill="none" stroke="#92400e" stroke-width="6" stroke-linecap="round"/>
    <!-- String drawn back -->
    <line x1="12" y1="-45" x2="-14" y2="0" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-14" y1="0" x2="12" y2="45" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Drawn Arrow -->
    <line x1="-14" y1="0" x2="50" y2="0" stroke="#ca8a04" stroke-width="4"/>
    <polygon points="50,0 42,-5 42,5" fill="#475569"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 40)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#f59e0b" letter-spacing="2">ARCHERY MASTER</text>
  </g>
</svg>
