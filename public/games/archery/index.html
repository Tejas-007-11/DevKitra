<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Archery Master — Devkitra Gaming</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #060911;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060911;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .hud-chip b {
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 16px;
    }
    .hud-chip.wind b {
      color: #f59e0b;
    }
    .arrows-rack {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .arrow-pip {
      width: 6px;
      height: 16px;
      background: #38bdf8;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    .arrow-pip.spent {
      background: #475569;
      opacity: 0.35;
      box-shadow: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 17, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .card-modal {
      background: #111827;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(56, 189, 248, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    .modal-icon {
      font-size: 48px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 16px rgba(245, 158, 11, 0.4));
    }
    .card-modal h2 {
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .card-modal p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .stats-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 22px;
    }
    .stat-box {
      background: #0a0f1d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      color: #ffffff;
      border: none;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
      transition: all 0.15s ease;
      width: 100%;
      text-transform: uppercase;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(14, 165, 233, 0.6);
    }
    .aim-hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.65);
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="game-wrap">
    <div class="hud-bar">
      <div class="hud-group">
        <div class="hud-chip">Range: <b id="stage-display">20m Olympic</b></div>
        <div class="hud-chip">Score: <b id="score-display">0</b></div>
      </div>
      <div class="hud-group">
        <div class="hud-chip wind" id="wind-chip">Wind: <b id="wind-display">0.0 m/s</b></div>
        <div class="hud-chip arrows-rack" id="arrows-rack"></div>
      </div>
    </div>

    <canvas id="archeryCanvas"></canvas>
    <div class="aim-hint">🎯 Hold & Drag to Aim the 3D Bow · Release to Fire!</div>

    <div id="overlay" class="overlay">
      <div class="card-modal">
        <div class="modal-icon" id="modal-icon">🏹</div>
        <h2 id="overlay-heading">3D ARCHERY MASTER</h2>
        <p id="overlay-desc">First-person Olympic 3D archery. Aim the bow, compensate for gravity and crosswind, and nail bullseyes down the 3D range!</p>
        <div class="stats-summary" id="stats-summary" style="display:none;">
          <div class="stat-box">
            <div class="stat-label">Final Score</div>
            <div class="stat-val" id="final-score">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Best Record</div>
            <div class="stat-val" id="final-best">0</div>
          </div>
        </div>
        <button id="start-btn" class="btn">START SHOOTING ▶</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Audio Synthesizer
      var audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playTone(freq, type, dur, gainVal, endFreq) {
        var actx = getAudio();
        if (!actx) return;
        try {
          var osc = actx.createOscillator();
          var gain = actx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + dur);
          gain.gain.setValueAtTime(gainVal || 0.08, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + dur);
        } catch(e) {}
      }

      function sfxDraw() { playTone(180, 'sine', 0.15, 0.04, 260); }
      function sfxShoot() { playTone(360, 'triangle', 0.12, 0.15, 90); }
      function sfxHit(isBullseye) {
        if (isBullseye) {
          playTone(523.25, 'triangle', 0.12, 0.16, 260);
          setTimeout(function() {
            playTone(784.0, 'sine', 0.25, 0.14);
            playTone(1046.5, 'sine', 0.35, 0.1);
          }, 60);
        } else {
          playTone(220, 'triangle', 0.12, 0.12, 120);
        }
      }

      var canvas = document.getElementById('archeryCanvas');
      var ctx = canvas.getContext('2d');
      var stageDisplay = document.getElementById('stage-display');
      var scoreDisplay = document.getElementById('score-display');
      var windDisplay = document.getElementById('wind-display');
      var arrowsRack = document.getElementById('arrows-rack');
      var overlay = document.getElementById('overlay');
      var modalIcon = document.getElementById('modal-icon');
      var overlayHeading = document.getElementById('overlay-heading');
      var overlayDesc = document.getElementById('overlay-desc');
      var statsSummary = document.getElementById('stats-summary');
      var finalScore = document.getElementById('final-score');
      var finalBest = document.getElementById('final-best');
      var startBtn = document.getElementById('start-btn');

      var W = 800;
      var H = 600;
      var dpr = 1;

      function resize() {
        var wrap = document.getElementById('game-wrap');
        W = wrap.clientWidth || window.innerWidth;
        H = wrap.clientHeight || window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.resetTransform?.();
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      // Stages (Olympic distances)
      var STAGES = [
        { name: '20m Warmup', distance: 20, windMax: 1.2, arrows: 5 },
        { name: '30m Club', distance: 30, windMax: 2.5, arrows: 5 },
        { name: '50m National', distance: 50, windMax: 4.2, arrows: 5 },
        { name: '70m Olympic', distance: 70, windMax: 6.5, arrows: 5 }
      ];

      var stageIndex = 0;
      var score = 0;
      var bestScore = 0;
      try { bestScore = parseInt(localStorage.getItem('dk:archery-best') || '0', 10); } catch(e) {}

      var arrowsLeft = 5;
      var windX = 0; // m/s
      var isRunning = false;

      // Bow & Aiming State
      var isAiming = false;
      var aimPos = { x: 0, y: 0 };
      var aimStart = { x: 0, y: 0 };
      var drawTension = 0; // 0 to 1
      var breathTimer = 0;

      // 3D Ballistics State
      // Coordinate System:
      // X: Horizontal (-left, +right)
      // Y: Vertical (+up, -down)
      // Z: Distance from shooter (+depth forward)
      var flyingArrow = null;
      var targetArrows = []; // Embedded arrows in the target face
      var callouts = [];
      var particles = [];
      var zoomCam = 0; // Target camera zoom on impact

      function updateArrowsRack() {
        arrowsRack.innerHTML = '';
        var total = STAGES[stageIndex].arrows;
        for (var i = 0; i < total; i++) {
          var pip = document.createElement('div');
          pip.className = 'arrow-pip' + (i >= arrowsLeft ? ' spent' : '');
          arrowsRack.appendChild(pip);
        }
      }

      function initStage() {
        var st = STAGES[stageIndex];
        stageDisplay.textContent = st.name;
        arrowsLeft = st.arrows;
        updateArrowsRack();
        targetArrows = [];
        flyingArrow = null;
        zoomCam = 0;

        // Generate wind
        var dir = Math.random() > 0.5 ? 1 : -1;
        var spd = Math.round((Math.random() * st.windMax) * 10) / 10;
        windX = dir * spd;

        var windArrow = windX > 0 ? '→' : windX < 0 ? '←' : '•';
        windDisplay.textContent = Math.abs(windX).toFixed(1) + ' m/s ' + windArrow;
      }

      function initGame() {
        score = 0;
        stageIndex = 0;
        scoreDisplay.textContent = '0';
        callouts = [];
        particles = [];
        initStage();
      }

      // 3D Perspective Projection
      // Projects 3D world (X, Y, Z in meters) to 2D screen coordinates
      function project3D(x, y, z) {
        var fov = 340; // Focal length
        var cameraHeight = 1.4; // 1.4m shooter eye level
        var vanishY = H * 0.46; // Horizon line
        var centerX = W / 2;

        var scale = fov / Math.max(1, z);
        var screenX = centerX + x * scale;
        var screenY = vanishY - (y - cameraHeight) * scale;

        return { x: screenX, y: screenY, scale: scale };
      }

      // Input Handlers
      function handleStartAim(clientX, clientY) {
        if (!isRunning || flyingArrow || arrowsLeft <= 0) return;
        getAudio();
        var rect = canvas.getBoundingClientRect();
        var mx = clientX - rect.left;
        var my = clientY - rect.top;

        isAiming = true;
        aimStart = { x: mx, y: my };
        aimPos = { x: mx, y: my };
        drawTension = 0.1;
        sfxDraw();
      }

      function handleMoveAim(clientX, clientY) {
        if (!isAiming) return;
        var rect = canvas.getBoundingClientRect();
        var mx = clientX - rect.left;
        var my = clientY - rect.top;

        aimPos = { x: mx, y: my };
        var dist = Math.hypot(mx - aimStart.x, my - aimStart.y);
        drawTension = Math.min(1.0, 0.2 + dist / 90);
      }

      function handleReleaseAim() {
        if (!isAiming) return;
        isAiming = false;

        if (drawTension < 0.35) {
          drawTension = 0;
          return;
        }

        // Fire Arrow!
        sfxShoot();
        arrowsLeft--;
        updateArrowsRack();

        var st = STAGES[stageIndex];
        // Convert screen aim crosshair to 3D trajectory
        // Center screen offset
        var centerX = W / 2;
        var vanishY = H * 0.46;
        var dx = (aimPos.x - centerX) / (W * 0.35); // Horizontal angle
        var dy = (vanishY - aimPos.y) / (H * 0.35); // Vertical elevation

        // Physical flight parameters
        var arrowSpeed = 58 + drawTension * 16; // m/s (approx 210-270 km/h)
        flyingArrow = {
          x: 0,
          y: 1.4, // Eye level
          z: 0.5,
          vx: dx * 4.5,
          vy: dy * 3.8 + (st.distance * 0.045), // Compensate for baseline distance
          vz: arrowSpeed,
          rot: 0,
          distTarget: st.distance,
          trail: []
        };

        drawTension = 0;
      }

      // Mouse & Touch bindings
      canvas.addEventListener('mousedown', function(e) { handleStartAim(e.clientX, e.clientY); });
      window.addEventListener('mousemove', function(e) { handleMoveAim(e.clientX, e.clientY); });
      window.addEventListener('mouseup', handleReleaseAim);

      canvas.addEventListener('touchstart', function(e) {
        if (e.touches.length > 0) handleStartAim(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('touchmove', function(e) {
        if (e.touches.length > 0) handleMoveAim(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('touchend', handleReleaseAim);

      // Scoring & Ring Detection
      function processTargetHit(targetX, targetY) {
        var ringDist = Math.hypot(targetX, targetY);
        // Target face diameter = 1.22m (Olympic 122cm face)
        // 10 concentric rings of 6.1cm each
        var pts = 0;
        var ringLabel = 'MISS 0';
        var isBullseye = false;
        var ringColor = '#94a3b8';

        if (ringDist <= 0.035) {
          pts = 10;
          ringLabel = 'INNER X · 10! 🎯';
          isBullseye = true;
          ringColor = '#facc15';
        } else if (ringDist <= 0.061) {
          pts = 10;
          ringLabel = 'BULLSEYE 10! 🎯';
          isBullseye = true;
          ringColor = '#facc15';
        } else if (ringDist <= 0.122) {
          pts = 9; ringLabel = 'GOLD · 9'; ringColor = '#facc15';
        } else if (ringDist <= 0.183) {
          pts = 8; ringLabel = 'RED · 8'; ringColor = '#ef4444';
        } else if (ringDist <= 0.244) {
          pts = 7; ringLabel = 'RED · 7'; ringColor = '#ef4444';
        } else if (ringDist <= 0.305) {
          pts = 6; ringLabel = 'BLUE · 6'; ringColor = '#3b82f6';
        } else if (ringDist <= 0.366) {
          pts = 5; ringLabel = 'BLUE · 5'; ringColor = '#3b82f6';
        } else if (ringDist <= 0.427) {
          pts = 4; ringLabel = 'BLACK · 4'; ringColor = '#475569';
        } else if (ringDist <= 0.488) {
          pts = 3; ringLabel = 'BLACK · 3'; ringColor = '#475569';
        } else if (ringDist <= 0.549) {
          pts = 2; ringLabel = 'WHITE · 2'; ringColor = '#e2e8f0';
        } else if (ringDist <= 0.61) {
          pts = 1; ringLabel = 'WHITE · 1'; ringColor = '#e2e8f0';
        }

        sfxHit(isBullseye);
        score += pts;
        scoreDisplay.textContent = score;

        // Zoom camera in on target for dramatic feedback
        zoomCam = 1.0;

        // Hit Callout Banner
        var st = STAGES[stageIndex];
        var p = project3D(targetX, 1.3 + targetY, st.distance);
        callouts.push({
          text: ringLabel,
          x: p.x,
          y: p.y - 28,
          color: ringColor,
          life: 1.3
        });

        // Hit particles
        for (var i = 0; i < (isBullseye ? 24 : 12); i++) {
          var ang = Math.random() * Math.PI * 2;
          var spd = Math.random() * 3 + 1;
          particles.push({
            x: p.x,
            y: p.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 1,
            color: ringColor,
            size: 3,
            life: 1
          });
        }

        // Check stage progression after brief delay
        if (arrowsLeft <= 0) {
          setTimeout(function() {
            if (stageIndex < STAGES.length - 1) {
              stageIndex++;
              initStage();
            } else {
              gameOver();
            }
          }, 1600);
        }
      }

      function gameOver() {
        isRunning = false;
        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem('dk:archery-best', String(bestScore)); } catch(e) {}
        }
        finalScore.textContent = score;
        finalBest.textContent = bestScore;
        statsSummary.style.display = 'grid';
        overlayHeading.textContent = score >= 160 ? 'OLYMPIC GOLD!' : 'MATCH COMPLETE';
        overlayDesc.textContent = 'All 4 tournament stages completed! Review your final archery scorecard:';
        startBtn.textContent = 'SHOOT AGAIN ▶';
        overlay.classList.remove('hidden');

        try {
          window.parent.postMessage({ type: 'dk:gameover', score: score }, '*');
        } catch(e) {}
      }

      function startGame() {
        getAudio();
        overlay.classList.add('hidden');
        initGame();
        isRunning = true;
      }
      startBtn.addEventListener('click', startGame);

      // Devkitra bus
      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.type === 'dk:restart') startGame();
        else if (e.data.type === 'dk:resize') resize();
      });

      // Animation Loop
      var lastTime = 0;
      function update(dt) {
        breathTimer += dt * 2.2;

        if (zoomCam > 0) {
          zoomCam = Math.max(0, zoomCam - dt * 0.65);
        }

        // Arrow 3D flight physics
        if (flyingArrow) {
          var a = flyingArrow;
          var st = STAGES[stageIndex];
          var stepDt = Math.min(0.03, dt);

          // Apply physics
          a.z += a.vz * stepDt;
          a.y += a.vy * stepDt;
          a.vy -= 9.8 * stepDt; // Gravity drop
          a.x += (a.vx + windX * 0.45) * stepDt; // Wind deflection
          a.rot += 12 * stepDt;

          a.trail.push({ x: a.x, y: a.y, z: a.z });
          if (a.trail.length > 8) a.trail.shift();

          // Check target plane impact
          if (a.z >= a.distTarget) {
            var hitX = a.x;
            var hitY = a.y - 1.3; // 1.3m is target bullseye center height
            targetArrows.push({ x: hitX, y: hitY });
            processTargetHit(hitX, hitY);
            flyingArrow = null;
          }
        }

        // Update particles
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.vy += 0.08;
          pt.life -= dt * 1.2;
          if (pt.life <= 0) particles.splice(p, 1);
        }

        // Update callouts
        for (var c = callouts.length - 1; c >= 0; c--) {
          var co = callouts[c];
          co.y -= 0.6;
          co.life -= dt * 0.9;
          if (co.life <= 0) callouts.splice(c, 1);
        }
      }

      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);

        var st = STAGES[stageIndex];
        var vanishY = H * 0.46;

        // 1. Sky Gradient
        var skyGrad = ctx.createLinearGradient(0, 0, 0, vanishY);
        skyGrad.addColorStop(0, '#0a1628');
        skyGrad.addColorStop(0.6, '#0f243e');
        skyGrad.addColorStop(1, '#1b3a5c');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, vanishY);

        // Distant Trees / Mountains Silhouette
        ctx.fillStyle = '#081726';
        ctx.beginPath();
        ctx.moveTo(0, vanishY);
        for (var mx = 0; mx <= W; mx += 40) {
          var mh = 12 + Math.sin(mx * 0.02) * 10 + Math.cos(mx * 0.05) * 6;
          ctx.lineTo(mx, vanishY - mh);
        }
        ctx.lineTo(W, vanishY);
        ctx.closePath();
        ctx.fill();

        // 2. 3D Stadium Turf / Grass Field
        var fieldGrad = ctx.createLinearGradient(0, vanishY, 0, H);
        fieldGrad.addColorStop(0, '#0f381e');
        fieldGrad.addColorStop(0.3, '#14532d');
        fieldGrad.addColorStop(1, '#052e16');
        ctx.fillStyle = fieldGrad;
        ctx.fillRect(0, vanishY, W, H - vanishY);

        // 3D Perspective Range Lines & Distance Markers
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1.5;
        // Lane guides
        var pLeftFar = project3D(-2.5, 0, 80);
        var pLeftNear = project3D(-4.0, 0, 2);
        ctx.beginPath();
        ctx.moveTo(pLeftNear.x, pLeftNear.y);
        ctx.lineTo(pLeftFar.x, pLeftFar.y);
        ctx.stroke();

        var pRightFar = project3D(2.5, 0, 80);
        var pRightNear = project3D(4.0, 0, 2);
        ctx.beginPath();
        ctx.moveTo(pRightNear.x, pRightNear.y);
        ctx.lineTo(pRightFar.x, pRightFar.y);
        ctx.stroke();

        // Distance chalk lines across lane
        var marks = [10, 20, 30, 50, 70];
        for (var m = 0; m < marks.length; m++) {
          var dist = marks[m];
          var pl = project3D(-2.5, 0, dist);
          var pr = project3D(2.5, 0, dist);
          ctx.strokeStyle = dist === st.distance ? '#facc15' : 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = dist === st.distance ? 2 : 1;
          ctx.beginPath();
          ctx.moveTo(pl.x, pl.y);
          ctx.lineTo(pr.x, pr.y);
          ctx.stroke();

          // Distance Tag Text
          ctx.fillStyle = dist === st.distance ? '#facc15' : 'rgba(255, 255, 255, 0.4)';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(dist + 'm', pr.x + 8, pr.y + 3);
        }

        // 3. Draw 3D Target Stand & Rings
        var targetDist = st.distance;
        var pTarget = project3D(0, 1.3, targetDist);
        var targetScale = pTarget.scale;

        // Wooden Tripod Legs
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = Math.max(2, 4 * (targetScale / 12));
        var pLegL = project3D(-0.45, 0, targetDist);
        var pLegR = project3D(0.45, 0, targetDist);
        var pTop = project3D(0, 1.8, targetDist);
        ctx.beginPath();
        ctx.moveTo(pTop.x, pTop.y);
        ctx.lineTo(pLegL.x, pLegL.y);
        ctx.moveTo(pTop.x, pTop.y);
        ctx.lineTo(pLegR.x, pLegR.y);
        ctx.stroke();

        // Target Straw Boss (Circular backing)
        var bossRadius = 0.65 * targetScale;
        ctx.fillStyle = '#1c1917';
        ctx.beginPath();
        ctx.arc(pTarget.x, pTarget.y, bossRadius + 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#44403c';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 10 Official Concentric Colored Rings
        // Target 1.22m diameter -> radius 0.61m
        var ringColors = [
          { r: 0.61,  color: '#ffffff' }, // 1 (White)
          { r: 0.549, color: '#f1f5f9' }, // 2 (White)
          { r: 0.488, color: '#1e293b' }, // 3 (Black)
          { r: 0.427, color: '#0f172a' }, // 4 (Black)
          { r: 0.366, color: '#38bdf8' }, // 5 (Blue)
          { r: 0.305, color: '#0284c7' }, // 6 (Blue)
          { r: 0.244, color: '#f87171' }, // 7 (Red)
          { r: 0.183, color: '#dc2626' }, // 8 (Red)
          { r: 0.122, color: '#fde047' }, // 9 (Gold)
          { r: 0.061, color: '#eab308' }, // 10 (Gold Inner)
          { r: 0.030, color: '#ca8a04' }  // X (Center ring)
        ];

        for (var rc = 0; rc < ringColors.length; rc++) {
          var ring = ringColors[rc];
          var pixR = ring.r * targetScale;
          ctx.fillStyle = ring.color;
          ctx.beginPath();
          ctx.arc(pTarget.x, pTarget.y, pixR, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        // Center X crosshair
        var xPix = 0.015 * targetScale;
        ctx.strokeStyle = '#713f12';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pTarget.x - xPix, pTarget.y);
        ctx.lineTo(pTarget.x + xPix, pTarget.y);
        ctx.moveTo(pTarget.x, pTarget.y - xPix);
        ctx.lineTo(pTarget.x, pTarget.y + xPix);
        ctx.stroke();

        // Fluttering Wind Flag atop the target
        var flagPole = project3D(0, 1.88, targetDist);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pTarget.x, pTarget.y - bossRadius);
        ctx.lineTo(flagPole.x, flagPole.y);
        ctx.stroke();

        // Flag triangle blowing in wind direction
        var flagDir = windX >= 0 ? 1 : -1;
        var flagLen = (12 + Math.abs(windX) * 3) * (targetScale / 14);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(flagPole.x, flagPole.y);
        ctx.lineTo(flagPole.x + flagDir * flagLen, flagPole.y + 4);
        ctx.lineTo(flagPole.x, flagPole.y + 8);
        ctx.closePath();
        ctx.fill();

        // 4. Draw Embedded Arrows in Target Face
        for (var ta = 0; ta < targetArrows.length; ta++) {
          var ea = targetArrows[ta];
          var ep = project3D(ea.x, 1.3 + ea.y, targetDist);

          // Arrow nock & fletching sticking out in 3D
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(ep.x, ep.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(ep.x, ep.y);
          ctx.lineTo(ep.x - 4, ep.y + 6);
          ctx.moveTo(ep.x, ep.y);
          ctx.lineTo(ep.x + 4, ep.y + 6);
          ctx.stroke();
        }

        // 5. Draw Flying 3D Arrow
        if (flyingArrow) {
          var fa = flyingArrow;
          var pArrow = project3D(fa.x, fa.y, fa.z);
          var pNock = project3D(fa.x, fa.y + 0.05, fa.z - 0.7);

          // Arrow Shaft
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = Math.max(1.5, 3.5 * (pArrow.scale / 20));
          ctx.beginPath();
          ctx.moveTo(pArrow.x, pArrow.y);
          ctx.lineTo(pNock.x, pNock.y);
          ctx.stroke();

          // Arrow Point
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(pArrow.x, pArrow.y, 2.5, 0, Math.PI * 2);
          ctx.fill();

          // Vane / Fletchings (Fluorescent Cyan)
          ctx.fillStyle = '#00f0ff';
          ctx.beginPath();
          ctx.arc(pNock.x, pNock.y, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 6. Draw First-Person Bow & Sight in Foreground
        if (!flyingArrow && arrowsLeft > 0 && isRunning) {
          var bowX = W / 2;
          var bowY = H;
          var breathSwayX = Math.sin(breathTimer) * (isAiming ? 3 : 6);
          var breathSwayY = Math.cos(breathTimer * 1.4) * (isAiming ? 2 : 5);

          var aimScreenX = (isAiming ? aimPos.x : W / 2) + breathSwayX;
          var aimScreenY = (isAiming ? aimPos.y : H * 0.46) + breathSwayY;

          // Draw Aiming Sight Reticle
          ctx.save();
          ctx.strokeStyle = isAiming ? '#38bdf8' : 'rgba(56, 189, 248, 0.4)';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(aimScreenX, aimScreenY, 16, 0, Math.PI * 2);
          ctx.stroke();

          // Reticle crosshair pin
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(aimScreenX, aimScreenY, 2.5, 0, Math.PI * 2);
          ctx.fill();

          // Reticle ticks
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(aimScreenX - 22, aimScreenY);
          ctx.lineTo(aimScreenX - 16, aimScreenY);
          ctx.moveTo(aimScreenX + 16, aimScreenY);
          ctx.lineTo(aimScreenX + 22, aimScreenY);
          ctx.moveTo(aimScreenX, aimScreenY - 22);
          ctx.lineTo(aimScreenX, aimScreenY - 16);
          ctx.moveTo(aimScreenX, aimScreenY + 16);
          ctx.lineTo(aimScreenX, aimScreenY + 22);
          ctx.stroke();
          ctx.restore();

          // Draw Recurve Bow Limbs (Foreground)
          ctx.save();
          var bowTensionPull = drawTension * 65;
          var bowTipTopX = aimScreenX - 140;
          var bowTipTopY = aimScreenY - 180;
          var bowTipBotX = aimScreenX - 140;
          var bowTipBotY = aimScreenY + 240;
          var bowGripX = aimScreenX - 120;
          var bowGripY = aimScreenY + 30;

          // Upper Limb
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.moveTo(bowGripX, bowGripY);
          ctx.quadraticCurveTo(bowGripX - 25, bowGripY - 100, bowTipTopX, bowTipTopY);
          ctx.stroke();

          // Lower Limb
          ctx.beginPath();
          ctx.moveTo(bowGripX, bowGripY);
          ctx.quadraticCurveTo(bowGripX - 25, bowGripY + 130, bowTipBotX, bowTipBotY);
          ctx.stroke();

          // Bowstring
          var nockPointX = aimScreenX - 120 - bowTensionPull;
          var nockPointY = aimScreenY + 30;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(bowTipTopX, bowTipTopY);
          ctx.lineTo(nockPointX, nockPointY);
          ctx.lineTo(bowTipBotX, bowTipBotY);
          ctx.stroke();

          // Arrow resting on rest
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(nockPointX, nockPointY);
          ctx.lineTo(aimScreenX + 60, aimScreenY + 20);
          ctx.stroke();

          // Cyan Arrow Fletchings
          ctx.fillStyle = '#00f0ff';
          ctx.beginPath();
          ctx.arc(nockPointX + 10, nockPointY, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        // 7. Draw Particles
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size * Math.max(0, pt.life), 0, Math.PI * 2);
          ctx.fill();
        }

        // 8. Draw Callout Banners
        for (var cl = 0; cl < callouts.length; cl++) {
          var co = callouts[cl];
          ctx.save();
          ctx.globalAlpha = Math.max(0, co.life);
          ctx.font = '900 22px -apple-system, sans-serif';
          ctx.fillStyle = co.color;
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.85)';
          ctx.shadowBlur = 12;
          ctx.fillText(co.text, co.x, co.y);
          ctx.restore();
        }

        ctx.restore();
      }

      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        var dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
