<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Pong AI — Devkitra Gaming</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #top-bar {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      z-index: 10;
    }
    .scores-wrap {
      display: flex;
      align-items: center;
      gap: 24px;
      font-weight: 800;
    }
    .side-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.7;
    }
    .score-box {
      font-size: 24px;
      font-family: monospace;
      min-width: 24px;
      text-align: center;
      text-shadow: 0 0 12px currentColor;
    }
    .score-box.player { color: #38bdf8; }
    .score-box.ai { color: #f43f5e; }
    .vs-sep {
      color: #64748b;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .diff-selector {
      display: flex;
      gap: 4px;
      background: rgba(30, 41, 59, 0.8);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .diff-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .diff-btn.active {
      background: #0ea5e9;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
    }
    #game-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100% - 52px);
      background: radial-gradient(circle at center, #0b1329 0%, #030712 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.25s ease;
    }
    .overlay.hidden {
      display: none;
      opacity: 0;
    }
    .overlay-card {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.15);
      border-radius: 16px;
      padding: 32px 36px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .overlay-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .overlay-title.win { color: #4ade80; text-shadow: 0 0 16px rgba(74, 222, 128, 0.5); }
    .overlay-title.loss { color: #f43f5e; text-shadow: 0 0 16px rgba(244, 63, 94, 0.5); }
    .overlay-sub {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .primary-btn {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body>

  <header id="top-bar">
    <div class="scores-wrap">
      <div>
        <div class="side-tag">Player</div>
        <div id="player-score" class="score-box player">0</div>
      </div>
      <div class="vs-sep">VS</div>
      <div>
        <div class="side-tag">Cyber AI</div>
        <div id="ai-score" class="score-box ai">0</div>
      </div>
    </div>

    <div class="diff-selector" role="radiogroup" aria-label="AI Difficulty">
      <button class="diff-btn active" data-diff="novice">Novice</button>
      <button class="diff-btn" data-diff="pro">Pro</button>
      <button class="diff-btn" data-diff="beast">Beast</button>
    </div>
  </header>

  <main id="game-container">
    <canvas id="pongCanvas"></canvas>

    <!-- Overlay modal -->
    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 id="overlay-heading" class="overlay-title">NEON PONG</h2>
        <p id="overlay-msg" class="overlay-sub">Move paddle with Mouse, Touch, or Up/Down arrows. First to 5 points wins!</p>
        <button id="start-btn" class="primary-btn">PLAY MATCH</button>
      </div>
    </div>
  </main>

  <script>
    (function() {
      // Audio Synth
      var audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch(e) {}
        }
      }
      function playTone(freq, type, dur, gainVal) {
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(gainVal || 0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch(e) {}
      }

      function sfxPaddle() { playTone(480, 'square', 0.08, 0.1); }
      function sfxAIPaddle() { playTone(360, 'sawtooth', 0.08, 0.08); }
      function sfxWall() { playTone(240, 'triangle', 0.06, 0.08); }
      function sfxScore() {
        playTone(523.25, 'sine', 0.15, 0.15);
        setTimeout(function() { playTone(659.25, 'sine', 0.25, 0.15); }, 100);
      }
      function sfxLoss() {
        playTone(300, 'sawtooth', 0.2, 0.15);
        setTimeout(function() { playTone(200, 'sawtooth', 0.35, 0.15); }, 150);
      }

      // Game Canvas Setup
      var canvas = document.getElementById('pongCanvas');
      var ctx = canvas.getContext('2d');
      var container = document.getElementById('game-container');

      var playerScoreEl = document.getElementById('player-score');
      var aiScoreEl = document.getElementById('ai-score');
      var overlay = document.getElementById('overlay');
      var overlayHeading = document.getElementById('overlay-heading');
      var overlayMsg = document.getElementById('overlay-msg');
      var startBtn = document.getElementById('start-btn');
      var diffBtns = document.querySelectorAll('.diff-btn');

      var W = 800;
      var H = 500;
      var scale = 1;

      function resize() {
        var rect = container.getBoundingClientRect();
        canvas.width = rect.width * (window.devicePixelRatio || 1);
        canvas.height = rect.height * (window.devicePixelRatio || 1);
        W = rect.width;
        H = rect.height;
        ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
      }
      window.addEventListener('resize', resize);
      resize();

      // State
      var WINNING_SCORE = 5;
      var playerScore = 0;
      var aiScore = 0;
      var isRunning = false;
      var isPaused = false;
      var currentDiff = 'novice';

      var diffConfig = {
        novice: { aiSpeed: 4.8, aiError: 25, reactionLag: 0.08 },
        pro:    { aiSpeed: 7.2, aiError: 10, reactionLag: 0.14 },
        beast:  { aiSpeed: 10.0, aiError: 2, reactionLag: 0.24 }
      };

      // Paddle config
      var paddleWidth = 14;
      var paddleHeight = 85;

      var player = {
        x: 30,
        y: H / 2 - paddleHeight / 2,
        w: paddleWidth,
        h: paddleHeight,
        vy: 0,
        targetY: H / 2 - paddleHeight / 2
      };

      var ai = {
        x: W - 30 - paddleWidth,
        y: H / 2 - paddleHeight / 2,
        w: paddleWidth,
        h: paddleHeight,
        vy: 0,
        targetY: H / 2 - paddleHeight / 2
      };

      var ball = {
        x: W / 2,
        y: H / 2,
        r: 8,
        vx: 5,
        vy: 3,
        baseSpeed: 7,
        trail: []
      };

      var particles = [];

      function spawnHitParticles(x, y, color) {
        for (var i = 0; i < 16; i++) {
          var angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5);
          var speed = Math.random() * 5 + 2;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            alpha: 1,
            size: Math.random() * 3 + 2,
            life: 1
          });
        }
      }

      function resetBall(servingPlayer) {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.trail = [];
        var dir = servingPlayer === 'player' ? -1 : 1;
        var angle = (Math.random() * 0.8 - 0.4);
        var speed = ball.baseSpeed;
        ball.vx = dir * speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
      }

      function updatePositions() {
        player.x = 30;
        ai.x = W - 30 - paddleWidth;
      }

      // Input handling
      var keys = {};
      window.addEventListener('keydown', function(e) {
        if (['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS', ' '].includes(e.code)) {
          e.preventDefault();
        }
        keys[e.code] = true;
      });
      window.addEventListener('keyup', function(e) {
        keys[e.code] = false;
      });

      canvas.addEventListener('mousemove', function(e) {
        var rect = canvas.getBoundingClientRect();
        var my = e.clientY - rect.top;
        player.targetY = my - player.h / 2;
      });

      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length > 0) {
          var rect = canvas.getBoundingClientRect();
          var ty = e.touches[0].clientY - rect.top;
          player.targetY = ty - player.h / 2;
        }
      }, { passive: false });

      diffBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          diffBtns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentDiff = btn.getAttribute('data-diff');
        });
      });

      function update() {
        if (!isRunning || isPaused) return;

        updatePositions();

        // Keyboard controls
        if (keys['ArrowUp'] || keys['KeyW']) {
          player.targetY -= 9;
        }
        if (keys['ArrowDown'] || keys['KeyS']) {
          player.targetY += 9;
        }

        // Smooth player paddle easing
        player.targetY = Math.max(10, Math.min(H - player.h - 10, player.targetY));
        var prevPy = player.y;
        player.y += (player.targetY - player.y) * 0.35;
        player.vy = player.y - prevPy;

        // AI tracking
        var cfg = diffConfig[currentDiff];
        var aiCenter = ai.y + ai.h / 2;
        var targetAiY = ball.y - ai.h / 2;

        // Prediction & error offset
        if (ball.vx > 0) {
          var dist = ai.x - ball.x;
          var time = dist / ball.vx;
          var predictedY = ball.y + ball.vy * time;
          // Bounce prediction
          if (predictedY < 0 || predictedY > H) {
            predictedY = Math.abs(predictedY % (H * 2));
            if (predictedY > H) predictedY = H * 2 - predictedY;
          }
          targetAiY = predictedY - ai.h / 2;
        } else {
          // Reset towards center when ball is traveling away
          targetAiY = H / 2 - ai.h / 2;
        }

        var aiDiff = targetAiY - ai.y;
        var moveStep = Math.min(Math.abs(aiDiff), cfg.aiSpeed) * Math.sign(aiDiff);
        ai.y += moveStep;
        ai.y = Math.max(10, Math.min(H - ai.h - 10, ai.y));

        // Ball movement
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Ball trail
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 8) ball.trail.shift();

        // Wall collisions
        if (ball.y - ball.r <= 0) {
          ball.y = ball.r;
          ball.vy *= -1;
          sfxWall();
        } else if (ball.y + ball.r >= H) {
          ball.y = H - ball.r;
          ball.vy *= -1;
          sfxWall();
        }

        // Paddle Collision: Player
        if (
          ball.x - ball.r <= player.x + player.w &&
          ball.x + ball.r >= player.x &&
          ball.y >= player.y &&
          ball.y <= player.y + player.h &&
          ball.vx < 0
        ) {
          ball.x = player.x + player.w + ball.r;
          var hitOffset = (ball.y - (player.y + player.h / 2)) / (player.h / 2); // -1 to 1
          var speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 16);
          var returnAngle = hitOffset * (Math.PI / 3); // Max 60 deg
          ball.vx = Math.abs(speed * Math.cos(returnAngle));
          ball.vy = speed * Math.sin(returnAngle) + (player.vy * 0.2);
          sfxPaddle();
          spawnHitParticles(ball.x, ball.y, '#38bdf8');
        }

        // Paddle Collision: AI
        if (
          ball.x + ball.r >= ai.x &&
          ball.x - ball.r <= ai.x + ai.w &&
          ball.y >= ai.y &&
          ball.y <= ai.y + ai.h &&
          ball.vx > 0
        ) {
          ball.x = ai.x - ball.r;
          var aiHitOffset = (ball.y - (ai.y + ai.h / 2)) / (ai.h / 2);
          var aiSpeed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 16);
          var aiReturnAngle = aiHitOffset * (Math.PI / 3);
          ball.vx = -Math.abs(aiSpeed * Math.cos(aiReturnAngle));
          ball.vy = aiSpeed * Math.sin(aiReturnAngle);
          sfxAIPaddle();
          spawnHitParticles(ball.x, ball.y, '#f43f5e');
        }

        // Scoring
        if (ball.x < -20) {
          // AI scored
          aiScore++;
          aiScoreEl.textContent = aiScore;
          sfxLoss();
          checkWinOrReset('player');
        } else if (ball.x > W + 20) {
          // Player scored
          playerScore++;
          playerScoreEl.textContent = playerScore;
          sfxScore();
          checkWinOrReset('ai');
        }

        // Update particles
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.alpha -= 0.035;
          if (pt.alpha <= 0) particles.splice(p, 1);
        }
      }

      function checkWinOrReset(server) {
        if (playerScore >= WINNING_SCORE) {
          endGame(true);
        } else if (aiScore >= WINNING_SCORE) {
          endGame(false);
        } else {
          resetBall(server);
        }
      }

      function endGame(isWin) {
        isRunning = false;
        overlay.classList.remove('hidden');
        if (isWin) {
          overlayHeading.textContent = "VICTORY!";
          overlayHeading.className = "overlay-title win";
          overlayMsg.textContent = "You defeated the Cyber AI (" + playerScore + " - " + aiScore + ") on " + currentDiff.toUpperCase() + " mode!";
        } else {
          overlayHeading.textContent = "DEFEAT";
          overlayHeading.className = "overlay-title loss";
          overlayMsg.textContent = "Cyber AI won (" + aiScore + " - " + playerScore + "). Ready for revenge?";
        }
        startBtn.textContent = "PLAY AGAIN";

        window.parent.postMessage({
          type: 'dk:gameover',
          score: playerScore,
          stats: {
            playerScore: playerScore,
            aiScore: aiScore,
            difficulty: currentDiff
          }
        }, '*');
      }

      function render() {
        ctx.clearRect(0, 0, W, H);

        // Center dashed net
        ctx.strokeStyle = "rgba(56, 189, 248, 0.15)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);

        // Outer arena boundary glow
        ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, W - 20, H - 20);

        // Ball trail
        for (var t = 0; t < ball.trail.length; t++) {
          var tr = ball.trail[t];
          var a = (t + 1) / ball.trail.length * 0.35;
          ctx.beginPath();
          ctx.arc(tr.x, tr.y, ball.r * (0.6 + 0.4 * (t / ball.trail.length)), 0, Math.PI * 2);
          ctx.fillStyle = "rgba(56, 189, 248, " + a + ")";
          ctx.fill();
        }

        // Ball
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Player Paddle
        ctx.save();
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#0ea5e9';
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(player.x, player.y, player.w, player.h, 6) : ctx.rect(player.x, player.y, player.w, player.h);
        ctx.fill();
        ctx.restore();

        // AI Paddle
        ctx.save();
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#f43f5e';
        ctx.fillStyle = '#fb7185';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(ai.x, ai.y, ai.w, ai.h, 6) : ctx.rect(ai.x, ai.y, ai.w, ai.h);
        ctx.fill();
        ctx.restore();

        // Particles
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.alpha);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        update();
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      function startMatch() {
        initAudio();
        playerScore = 0;
        aiScore = 0;
        playerScoreEl.textContent = '0';
        aiScoreEl.textContent = '0';
        overlay.classList.add('hidden');
        isRunning = true;
        isPaused = false;
        resetBall('player');
      }

      startBtn.addEventListener('click', startMatch);

      // Parent communication
      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.type === 'dk:restart') {
          startMatch();
        } else if (e.data.type === 'dk:pause') {
          isPaused = true;
        } else if (e.data.type === 'dk:resume') {
          isPaused = false;
        }
      });

      window.parent.postMessage({ type: 'dk:ready' }, '*');
    })();
  </script>
</body>
</html>
