<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#sky-bg)"/>

  <!-- Fluffy White Clouds -->
  <g fill="rgba(255, 255, 255, 0.7)">
    <circle cx="100" cy="80" r="35"/>
    <circle cx="140" cy="70" r="45"/>
    <circle cx="180" cy="85" r="35"/>

    <circle cx="440" cy="140" r="40"/>
    <circle cx="490" cy="130" r="50"/>
    <circle cx="530" cy="145" r="40"/>
  </g>

  <!-- Green Bouncy Platforms -->
  <rect x="80" y="320" width="130" height="24" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <rect x="360" y="270" width="130" height="24" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <rect x="220" y="190" width="140" height="24" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <rect x="110" y="100" width="120" height="24" rx="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>

  <!-- Golden Spring on middle platform -->
  <rect x="280" y="174" width="28" height="16" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Cute Yellow Bouncing Doodler -->
  <g transform="translate(290, 110)">
    <!-- Motion lines -->
    <line x1="0" y1="28" x2="0" y2="46" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,6"/>
    <!-- Body -->
    <circle cx="0" cy="0" r="28" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <!-- Snout -->
    <ellipse cx="22" cy="4" rx="14" ry="8" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <!-- Eye -->
    <circle cx="8" cy="-6" r="6" fill="#0f172a"/>
    <circle cx="10" cy="-7" r="2" fill="#ffffff"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 40)">
    <rect x="-80" y="-16" width="160" height="32" rx="16" fill="rgba(255, 255, 255, 0.9)" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#0284c7" letter-spacing="2">SKY JUMP</text>
  </g>
</svg>
