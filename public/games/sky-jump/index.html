<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sky Jump — Devkitra Gaming</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    .hud-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      color: #f8fafc;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .hud-chip b {
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 17px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .card-modal {
      background: #151b28;
      border: 1px solid #2d374d;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .card-modal h2 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .card-modal p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .stats-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 24px;
    }
    .stat-box {
      background: #0f1420;
      border: 1px solid #252e42;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
      transition: all 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="game-wrap">
    <div class="hud-bar">
      <div class="hud-chip">Altitude: <b id="score-display">0 m</b></div>
      <div class="hud-chip">Zone: <b id="zone-display">Blue Sky</b></div>
      <div class="hud-chip">Best: <b id="best-display">0 m</b></div>
    </div>

    <canvas id="jumpCanvas"></canvas>

    <div id="overlay" class="overlay">
      <div class="card-modal">
        <div class="modal-icon" id="modal-icon">🚀</div>
        <h2 id="overlay-heading">SKY JUMP</h2>
        <p id="overlay-desc">Use Left & Right arrow keys, A/D, or move mouse/tilt screen to bounce up platforms and reach outer orbit!</p>
        <div class="stats-summary" id="stats-summary" style="display:none;">
          <div class="stat-box">
            <div class="stat-label">Altitude</div>
            <div class="stat-val" id="final-alt">0 m</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Best Record</div>
            <div class="stat-val" id="final-best">0 m</div>
          </div>
        </div>
        <button id="start-btn" class="btn">START JUMPING</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Audio synth
      var audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch(e) {}
        }
        return audioCtx;
      }
      function playTone(freq, type, dur, gainVal, endFreq) {
        var actx = getAudio();
        if (!actx) return;
        try {
          var osc = actx.createOscillator();
          var gain = actx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + dur);
          gain.gain.setValueAtTime(gainVal || 0.08, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + dur);
        } catch(e) {}
      }

      function sfxBounce() { playTone(360, 'sine', 0.09, 0.08, 560); }
      function sfxSpring() {
        playTone(480, 'sine', 0.12, 0.1, 880);
        setTimeout(function() { playTone(960, 'sine', 0.22, 0.08, 1400); }, 80);
      }
      function sfxCrack() { playTone(160, 'triangle', 0.1, 0.08, 80); }
      function sfxFall() { playTone(280, 'sine', 0.35, 0.09, 90); }

      var canvas = document.getElementById('jumpCanvas');
      var ctx = canvas.getContext('2d');
      var scoreDisplay = document.getElementById('score-display');
      var zoneDisplay = document.getElementById('zone-display');
      var bestDisplay = document.getElementById('best-display');
      var overlay = document.getElementById('overlay');
      var modalIcon = document.getElementById('modal-icon');
      var overlayHeading = document.getElementById('overlay-heading');
      var overlayDesc = document.getElementById('overlay-desc');
      var statsSummary = document.getElementById('stats-summary');
      var finalAlt = document.getElementById('final-alt');
      var finalBest = document.getElementById('final-best');
      var startBtn = document.getElementById('start-btn');

      var W = 460;
      var H = 700;
      var dpr = 1;

      function resize() {
        var wrap = document.getElementById('game-wrap');
        var wrapW = wrap.clientWidth || window.innerWidth;
        var wrapH = wrap.clientHeight || window.innerHeight;

        // Calculate aspect ratio preserve (around 9:14)
        var targetW = Math.min(wrapW, Math.floor(wrapH * (480 / 720)));
        var targetH = wrapH;

        W = targetW;
        H = targetH;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        ctx.resetTransform?.();
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      var isRunning = false;
      var isPaused = false;
      var score = 0;
      var altitude = 0;
      var bestScore = 0;
      try { bestScore = parseInt(localStorage.getItem('dk:skyjump-best') || '0', 10); } catch(e) {}
      bestDisplay.textContent = bestScore + ' m';

      var player = {
        x: W / 2,
        y: H - 140,
        vx: 0,
        vy: 0,
        width: 38,
        height: 38,
        facing: 'right',
        squashY: 1,
        squashX: 1
      };

      var platforms = [];
      var particles = [];
      var callouts = [];
      var cameraY = 0;
      var globalTime = 0;

      var PLATFORM_TYPES = ['normal', 'moving', 'breakable', 'spring'];

      function createPlatform(y, typeOverride) {
        var type = typeOverride || 'normal';
        if (!typeOverride) {
          var rand = Math.random();
          if (rand < 0.55) type = 'normal';
          else if (rand < 0.78) type = 'moving';
          else if (rand < 0.90) type = 'breakable';
          else type = 'spring';
        }

        var pw = type === 'breakable' ? 64 : 74;
        return {
          x: Math.random() * (W - pw - 40) + 20,
          y: y,
          w: pw,
          h: 16,
          type: type,
          vx: type === 'moving' ? (Math.random() < 0.5 ? 1.6 : -1.6) : 0,
          broken: false,
          springCoil: type === 'spring' ? 1 : 0
        };
      }

      function initGame() {
        score = 0;
        altitude = 0;
        cameraY = 0;
        platforms = [];
        particles = [];
        callouts = [];

        player.x = W / 2;
        player.y = H - 120;
        player.vx = 0;
        player.vy = -12;
        player.squashX = 1;
        player.squashY = 1;

        // Base platform under player
        platforms.push(createPlatform(H - 60, 'normal'));
        platforms[0].x = W / 2 - 37;

        // Generate initial climb platforms
        var curY = H - 130;
        while (curY > -H * 2) {
          curY -= (Math.random() * 45 + 50);
          platforms.push(createPlatform(curY));
        }

        scoreDisplay.textContent = '0 m';
        updateZoneUI(0);
      }

      function updateZoneUI(alt) {
        if (alt < 1000) {
          zoneDisplay.textContent = '☁️ Troposphere';
          zoneDisplay.style.color = '#38bdf8';
        } else if (alt < 2500) {
          zoneDisplay.textContent = '🌅 Stratosphere';
          zoneDisplay.style.color = '#f59e0b';
        } else {
          zoneDisplay.textContent = '🌌 Outer Orbit';
          zoneDisplay.style.color = '#c084fc';
        }
      }

      // Input
      var keys = {};
      window.addEventListener('keydown', function(e) {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); keys.left = true; player.facing = 'left'; }
        else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); keys.right = true; player.facing = 'right'; }
        else if (e.code === 'Space' && !isRunning) { e.preventDefault(); startGame(); }
      });
      window.addEventListener('keyup', function(e) {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
        else if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      });

      // Mouse / Touch steer
      canvas.addEventListener('mousemove', function(e) {
        if (!isRunning || isPaused) return;
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var diff = mx - player.x;
        player.vx = Math.max(-8, Math.min(8, diff * 0.12));
        if (diff > 4) player.facing = 'right';
        else if (diff < -4) player.facing = 'left';
      });

      canvas.addEventListener('touchmove', function(e) {
        if (!isRunning || isPaused || !e.touches.length) return;
        var rect = canvas.getBoundingClientRect();
        var tx = e.touches[0].clientX - rect.left;
        var diff = tx - player.x;
        player.vx = Math.max(-8, Math.min(8, diff * 0.15));
        if (diff > 4) player.facing = 'right';
        else if (diff < -4) player.facing = 'left';
      }, { passive: true });

      function gameOver() {
        isRunning = false;
        sfxFall();

        try {
          if (altitude > bestScore) {
            bestScore = altitude;
            localStorage.setItem('dk:skyjump-best', String(bestScore));
            bestDisplay.textContent = bestScore + ' m';
          }
        } catch(e) {}

        try {
          window.parent.postMessage({ type: 'dk:gameover', score: altitude }, '*');
        } catch(e) {}

        overlayHeading.textContent = 'PLUMMETED!';
        overlayDesc.textContent = 'You missed a platform! Keep steering left and right to climb higher.';
        finalAlt.textContent = altitude + ' m';
        finalBest.textContent = bestScore + ' m';
        statsSummary.style.display = 'grid';
        startBtn.textContent = 'JUMP AGAIN';
        overlay.classList.remove('hidden');
      }

      function startGame() {
        getAudio();
        overlay.classList.add('hidden');
        initGame();
        isRunning = true;
      }
      startBtn.addEventListener('click', startGame);

      // Devkitra messages
      window.addEventListener('message', function(e) {
        var data = e.data || {};
        if (data.type === 'dk:restart') startGame();
        else if (data.type === 'dk:pause') isPaused = true;
        else if (data.type === 'dk:resume') isPaused = false;
        else if (data.type === 'dk:resize') resize();
      });

      // Update
      function update() {
        globalTime += 0.02;

        if (isRunning && !isPaused) {
          // Horizontal steering
          if (keys.left) player.vx = -6.5;
          else if (keys.right) player.vx = 6.5;
          else player.vx *= 0.88;

          player.x += player.vx;

          // Screen wrap-around
          if (player.x < -player.width / 2) player.x = W + player.width / 2;
          else if (player.x > W + player.width / 2) player.x = -player.width / 2;

          // Vertical Gravity
          player.vy += 0.38;
          player.y += player.vy;

          // Squash & stretch recovery
          player.squashX += (1 - player.squashX) * 0.15;
          player.squashY += (1 - player.squashY) * 0.15;

          // Platform collisions (only when falling downwards)
          if (player.vy > 0) {
            for (var i = 0; i < platforms.length; i++) {
              var p = platforms[i];
              if (p.broken) continue;

              if (player.x + player.width * 0.3 > p.x &&
                  player.x - player.width * 0.3 < p.x + p.w &&
                  player.y + player.height * 0.5 >= p.y &&
                  player.y + player.height * 0.5 <= p.y + p.h + player.vy + 2) {

                if (p.type === 'breakable') {
                  p.broken = true;
                  sfxCrack();
                  // Spawn breaking fragments
                  for (var b = 0; b < 8; b++) {
                    particles.push({
                      x: p.x + Math.random() * p.w,
                      y: p.y,
                      vx: (Math.random() - 0.5) * 3,
                      vy: Math.random() * 3 + 2,
                      color: '#78350f',
                      size: 4,
                      life: 1
                    });
                  }
                  break;
                } else if (p.type === 'spring') {
                  player.vy = -21;
                  player.squashY = 1.45;
                  player.squashX = 0.7;
                  sfxSpring();
                  p.springCoil = 0.3; // compressed coil animation

                  // Spring starburst
                  for (var s = 0; s < 12; s++) {
                    var ang = Math.random() * Math.PI * 2;
                    particles.push({
                      x: p.x + p.w / 2,
                      y: p.y,
                      vx: Math.cos(ang) * (Math.random() * 3 + 1),
                      vy: Math.sin(ang) * (Math.random() * 3 + 1),
                      color: '#facc15',
                      size: 3,
                      life: 1
                    });
                  }
                  break;
                } else {
                  // Normal or Moving bounce
                  player.vy = -12.5;
                  player.squashY = 0.75;
                  player.squashX = 1.25;
                  sfxBounce();

                  for (var pt = 0; pt < 4; pt++) {
                    particles.push({
                      x: player.x + (Math.random() - 0.5) * 16,
                      y: player.y + player.height * 0.5,
                      vx: (Math.random() - 0.5) * 2,
                      vy: Math.random() * 2,
                      color: '#22c55e',
                      size: 3,
                      life: 1
                    });
                  }
                  break;
                }
              }
            }
          }

          // Camera scroll when player is above middle
          if (player.y < H * 0.45) {
            var diff = (H * 0.45) - player.y;
            player.y = H * 0.45;
            cameraY += diff;
            altitude = Math.floor(cameraY / 10);
            scoreDisplay.textContent = altitude + ' m';
            updateZoneUI(altitude);

            if (altitude > 0 && altitude % 500 === 0) {
              callouts.push({
                text: '★ ' + altitude + 'm REACHED! ★',
                x: W / 2,
                y: H * 0.3,
                color: '#38bdf8',
                life: 1
              });
            }

            // Move platforms down with camera
            for (var m = 0; m < platforms.length; m++) {
              platforms[m].y += diff;
            }

            // Recycle off-screen platforms
            var highestY = platforms.reduce(function(min, pl) { return Math.min(min, pl.y); }, H);
            while (highestY > -H) {
              highestY -= (Math.random() * 45 + 50);
              platforms.push(createPlatform(highestY));
            }

            platforms = platforms.filter(function(pl) { return pl.y < H + 80; });
          }

          // Moving platforms animation
          for (var k = 0; k < platforms.length; k++) {
            var pf = platforms[k];
            if (pf.type === 'moving') {
              pf.x += pf.vx;
              if (pf.x < 10) { pf.x = 10; pf.vx = -pf.vx; }
              else if (pf.x > W - pf.w - 10) { pf.x = W - pf.w - 10; pf.vx = -pf.vx; }
            }
          }

          // Game over: fell below screen
          if (player.y > H + 40) {
            gameOver();
          }
        }

        // Particles
        for (var p = particles.length - 1; p >= 0; p--) {
          var pr = particles[p];
          pr.x += pr.vx;
          pr.y += pr.vy;
          pr.life -= 0.035;
          if (pr.life <= 0) particles.splice(p, 1);
        }

        // Callouts
        for (var c = callouts.length - 1; c >= 0; c--) {
          var cl = callouts[c];
          cl.y -= 0.6;
          cl.life -= 0.02;
          if (cl.life <= 0) callouts.splice(c, 1);
        }
      }

      // Render
      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);

        // Dynamic Altitude Background
        var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        if (altitude < 1000) {
          bgGrad.addColorStop(0, '#38bdf8');
          bgGrad.addColorStop(0.6, '#bae6fd');
          bgGrad.addColorStop(1, '#e0f2fe');
        } else if (altitude < 2500) {
          bgGrad.addColorStop(0, '#4c1d95');
          bgGrad.addColorStop(0.5, '#db2777');
          bgGrad.addColorStop(1, '#f59e0b');
        } else {
          bgGrad.addColorStop(0, '#030712');
          bgGrad.addColorStop(0.6, '#0f172a');
          bgGrad.addColorStop(1, '#1e1b4b');
        }
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Stars if high altitude
        if (altitude >= 1500) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          for (var s = 0; s < 30; s++) {
            var sx = (s * 47) % W;
            var sy = (s * 83 + globalTime * 15) % H;
            ctx.beginPath();
            ctx.arc(sx, sy, (s % 3) + 1, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw Platforms
        for (var i = 0; i < platforms.length; i++) {
          drawPlatform(platforms[i]);
        }

        // Draw Player
        drawCreature(player.x, player.y, player.width, player.height, player.squashX, player.squashY, player.facing);

        // Draw Particles
        for (var p = 0; p < particles.length; p++) {
          var pr = particles[p];
          ctx.fillStyle = pr.color;
          ctx.beginPath();
          ctx.arc(pr.x, pr.y, pr.size * pr.life, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw Callouts
        for (var c = 0; c < callouts.length; c++) {
          var cl = callouts[c];
          ctx.save();
          ctx.globalAlpha = Math.max(0, cl.life);
          ctx.font = '900 18px -apple-system, sans-serif';
          ctx.fillStyle = cl.color;
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 8;
          ctx.fillText(cl.text, cl.x, cl.y);
          ctx.restore();
        }

        ctx.restore();
      }

      function drawPlatform(pf) {
        if (pf.broken) return;

        ctx.save();
        ctx.translate(pf.x, pf.y);

        if (pf.type === 'normal') {
          // Lush green lawn on wood
          ctx.fillStyle = '#78350f';
          ctx.beginPath();
          ctx.roundRect(0, 4, pf.w, pf.h - 4, [0, 0, 6, 6]);
          ctx.fill();

          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.roundRect(0, 0, pf.w, 6, [4, 4, 0, 0]);
          ctx.fill();
        } else if (pf.type === 'moving') {
          // Fluffy Blue Cloud
          var cloudGrad = ctx.createLinearGradient(0, 0, 0, pf.h);
          cloudGrad.addColorStop(0, '#ffffff');
          cloudGrad.addColorStop(1, '#93c5fd');
          ctx.fillStyle = cloudGrad;
          ctx.beginPath();
          ctx.roundRect(0, 0, pf.w, pf.h, 8);
          ctx.fill();

          ctx.fillStyle = 'rgba(37, 99, 235, 0.4)';
          ctx.fillRect(4, pf.h - 3, pf.w - 8, 2);
        } else if (pf.type === 'breakable') {
          // Cracked Brown Ledge
          ctx.fillStyle = '#92400e';
          ctx.beginPath();
          ctx.roundRect(0, 0, pf.w, pf.h, 4);
          ctx.fill();

          // Crack lines
          ctx.strokeStyle = '#451a03';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(pf.w * 0.4, 0);
          ctx.lineTo(pf.w * 0.5, pf.h);
          ctx.stroke();
        } else if (pf.type === 'spring') {
          // Base platform
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.roundRect(0, 0, pf.w, pf.h, 6);
          ctx.fill();

          // Golden Spring
          ctx.strokeStyle = '#eab308';
          ctx.lineWidth = 3;
          ctx.beginPath();
          var spX = pf.w / 2;
          ctx.moveTo(spX - 8, 0);
          ctx.lineTo(spX + 8, -4);
          ctx.lineTo(spX - 8, -8);
          ctx.lineTo(spX + 8, -12);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawCreature(x, y, w, h, sx, sy, facing) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(sx, sy);

        // Body Gradient (lime green)
        var bodyGrad = ctx.createRadialGradient(-3, -4, 2, 0, 0, w / 2);
        bodyGrad.addColorStop(0, '#86efac');
        bodyGrad.addColorStop(0.6, '#22c55e');
        bodyGrad.addColorStop(1, '#15803d');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.roundRect(-w / 2, -h / 2, w, h, 14);
        ctx.fill();

        // Eyes
        var eyeOffX = facing === 'left' ? -4 : 4;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-6 + eyeOffX, -5, 6, 0, Math.PI * 2);
        ctx.arc(6 + eyeOffX, -5, 6, 0, Math.PI * 2);
        ctx.fill();

        // Pupils
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-5 + eyeOffX * 1.3, -5, 3, 0, Math.PI * 2);
        ctx.arc(7 + eyeOffX * 1.3, -5, 3, 0, Math.PI * 2);
        ctx.fill();

        // Cheeks
        ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.beginPath();
        ctx.arc(-11, 4, 3, 0, Math.PI * 2);
        ctx.arc(11, 4, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
