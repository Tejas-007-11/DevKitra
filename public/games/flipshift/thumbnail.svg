<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="fs-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neon-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="neon-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Arcade Space Background -->
  <rect width="600" height="400" fill="url(#fs-bg)"/>

  <!-- Subtle Perspective Corridor Speed Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Ceiling Surface -->
  <rect x="0" y="50" width="600" height="20" fill="#1e293b"/>
  <line x1="0" y1="70" x2="600" y2="70" stroke="#06b6d4" stroke-width="4" filter="url(#glow-cyan)"/>

  <!-- Floor Surface -->
  <rect x="0" y="270" width="600" height="20" fill="#1e293b"/>
  <line x1="0" y1="270" x2="600" y2="270" stroke="#06b6d4" stroke-width="4" filter="url(#glow-cyan)"/>

  <!-- Ceiling Spikes -->
  <polygon points="180,70 195,115 210,70" fill="url(#neon-magenta)"/>
  <polygon points="380,70 395,115 410,70" fill="url(#neon-magenta)"/>

  <!-- Floor Spikes -->
  <polygon points="100,270 115,225 130,270" fill="url(#neon-magenta)"/>
  <polygon points="460,270 475,225 490,270" fill="url(#neon-magenta)"/>

  <!-- Moving Laser Gate Obstacle (Center-Right) -->
  <rect x="520" y="70" width="10" height="70" fill="#ef4444" opacity="0.85"/>
  <line x1="525" y1="140" x2="525" y2="270" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" opacity="0.7"/>

  <!-- Collectible Energy Orbs (Floating Diamonds) -->
  <g transform="translate(230, 140) rotate(45)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="url(#neon-amber)" filter="url(#glow-cyan)"/>
  </g>
  <g transform="translate(350, 200) rotate(45)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="url(#neon-amber)" filter="url(#glow-cyan)"/>
  </g>

  <!-- Gravity Flip Trail Arc -->
  <path d="M 120 250 C 180 250, 220 90, 280 90" fill="none" stroke="rgba(6, 182, 212, 0.45)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8"/>
  <path d="M 280 90 C 310 90, 330 170, 370 170" fill="none" stroke="rgba(6, 182, 212, 0.45)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8"/>

  <!-- Glowing Player Orb (Mid-air flip towards ceiling) -->
  <circle cx="280" cy="115" r="28" fill="#06b6d4" opacity="0.25" filter="url(#glow-cyan)"/>
  <circle cx="280" cy="115" r="18" fill="url(#neon-cyan)" filter="url(#glow-cyan)"/>
  <circle cx="280" cy="115" r="9" fill="#ffffff"/>

  <!-- Upward Flip Direction Arrow Indicator inside Orb -->
  <polygon points="280,105 285,115 275,115" fill="#090d16"/>

  <!-- Badge Tagline Container -->
  <rect x="170" y="305" width="260" height="26" rx="13" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="300" y="322" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="2.5">ONE TAP · FLIP GRAVITY · SURVIVE</text>

  <!-- Title Typography -->
  <text x="300" y="365" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="6">
    FLIP<tspan fill="#06b6d4">SHIFT</tspan>
  </text>
</svg>

