<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Tower Stack — DevKitra Gaming</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body {
  width: 100%;
  height: 100%;
  background: #090d16;
  color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#game-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090d16;
  cursor: pointer;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: manipulation;
}
.hud-bar {
  position: absolute;
  top: 16px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}
.hud-group {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hud-chip {
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  color: #f8fafc;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.hud-chip b {
  color: #38bdf8;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 16px;
}
.combo-chip {
  display: none;
  background: rgba(16, 185, 129, 0.2);
  border: 1px solid rgba(16, 185, 129, 0.4);
  color: #34d399;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
  animation: pulse 0.6s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.hint-bar {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.55);
  pointer-events: none;
  text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

/* Modal Overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(9, 13, 22, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  text-align: center;
  padding: 24px;
  cursor: default;
}
.overlay.hidden { display: none; }
.card-modal {
  background: #111827;
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 20px;
  padding: 34px 28px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.modal-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.card-modal h2 {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.02em;
  color: #f59e0b;
  margin-bottom: 8px;
}
.card-modal p {
  color: #94a3b8;
  font-size: 14px;
  line-height: 1.55;
  margin-bottom: 24px;
}
.stats-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  margin-bottom: 24px;
}
.stat-box {
  background: #0f1420;
  border: 1px solid #252e42;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}
.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 700;
  color: #64748b;
  margin-bottom: 2px;
}
.stat-val {
  font-size: 20px;
  font-weight: 900;
  color: #38bdf8;
  font-family: ui-monospace, monospace;
}
.btn {
  background: #f59e0b;
  color: #0f172a;
  border: none;
  padding: 14px 36px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
  transition: all 0.15s ease;
  width: 100%;
}
.btn:hover {
  background: #d97706;
  transform: translateY(-2px);
}
</style>
</head>
<body>

<div id="game-wrap">
  <div class="hud-bar">
    <div class="hud-group">
      <div class="hud-chip">Height: <b id="score-display">0</b></div>
      <span class="combo-chip" id="combo-chip">PERFECT x2!</span>
    </div>
    <div class="hud-chip">Best: <b id="best-display">0</b></div>
  </div>

  <canvas id="stackCanvas"></canvas>
  <div class="hint-bar">Click, Tap, or Press Spacebar to drop the 3D block!</div>

  <div id="overlay" class="overlay">
    <div class="card-modal">
      <div class="modal-icon" id="modal-icon">🏛️</div>
      <h2 id="overlay-heading">TOWER STACK 3D</h2>
      <p id="overlay-desc">Time each drop to stack the highest 3D tower into the sky. Overhangs get sliced off with precision physics!</p>
      <div class="stats-summary" id="stats-summary" style="display:none;">
        <div class="stat-box">
          <div class="stat-label">Height</div>
          <div class="stat-val" id="final-score">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Best Record</div>
          <div class="stat-val" id="final-best">0</div>
        </div>
      </div>
      <button id="start-btn" class="btn">START STACKING ▶</button>
    </div>
  </div>
</div>

<script>
(function() {
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {}
    }
    return audioCtx;
  }

  function playTone(freq, type, dur, gainVal, endFreq) {
    var actx = getAudio();
    if (!actx) return;
    try {
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, actx.currentTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + dur);
      gain.gain.setValueAtTime(gainVal || 0.08, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + dur);
    } catch(e) {}
  }

  // Musical major scale notes for ascending perfect combo chords
  var SCALE = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
  function sfxPerfect(combo) {
    var note = SCALE[combo % SCALE.length];
    playTone(note, 'sine', 0.25, 0.12, note * 1.05);
    setTimeout(function() {
      playTone(note * 1.5, 'sine', 0.35, 0.08);
    }, 40);
  }

  function sfxDrop() {
    playTone(280, 'triangle', 0.08, 0.08, 180);
  }

  function sfxGameOver() {
    playTone(220, 'triangle', 0.35, 0.15, 60);
  }

  var wrap = document.getElementById('game-wrap');
  var canvas = document.getElementById('stackCanvas');
  var ctx = canvas.getContext('2d');

  var scoreDisplay = document.getElementById('score-display');
  var bestDisplay = document.getElementById('best-display');
  var comboChip = document.getElementById('combo-chip');
  var overlay = document.getElementById('overlay');
  var modalIcon = document.getElementById('modal-icon');
  var overlayHeading = document.getElementById('overlay-heading');
  var overlayDesc = document.getElementById('overlay-desc');
  var statsSummary = document.getElementById('stats-summary');
  var finalScore = document.getElementById('final-score');
  var finalBest = document.getElementById('final-best');
  var startBtn = document.getElementById('start-btn');

  var W = 800;
  var H = 600;
  var dpr = 1;

  function resize() {
    W = wrap.clientWidth || window.innerWidth;
    H = wrap.clientHeight || window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.resetTransform?.();
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  var isRunning = false;
  var score = 0;
  var bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('dk:stack-best') || '0', 10); } catch(e) {}
  bestDisplay.textContent = bestScore;

  // 3D Isometric Projection Constants
  // X axis projects at (+cos(30), +sin(30))
  // Z axis projects at (-cos(30), +sin(30))
  // Y axis projects straight UP (-y)
  var ISO_COS = 0.866; // cos(30 deg)
  var ISO_SIN = 0.5;   // sin(30 deg)
  var BLOCK_HEIGHT = 16;
  var BASE_SIZE = 140;

  var stack = [];
  var activeBlock = null;
  var slicedPieces = [];
  var rings = [];
  var combo = 0;
  var cameraY = 0;
  var targetCameraY = 0;

  function getHue(index) {
    return (index * 8 + 195) % 360;
  }

  function toScreen(x, y, z) {
    var centerX = W / 2;
    var centerY = H * 0.72 - cameraY;
    var screenX = centerX + (x - z) * ISO_COS;
    var screenY = centerY + (x + z) * ISO_SIN - (y * BLOCK_HEIGHT);
    return { x: screenX, y: screenY };
  }

  function initGame() {
    score = 0;
    combo = 0;
    cameraY = 0;
    targetCameraY = 0;
    slicedPieces = [];
    rings = [];

    scoreDisplay.textContent = '0';
    comboChip.style.display = 'none';

    // Base block
    stack = [{
      x: 0,
      z: 0,
      y: 0,
      w: BASE_SIZE,
      d: BASE_SIZE,
      hue: getHue(0)
    }];

    spawnBlock(1);
  }

  function spawnBlock(level) {
    var top = stack[stack.length - 1];
    var axis = (level % 2 === 1) ? 'x' : 'z';
    var speed = 3.6 + Math.min(level * 0.08, 4.2);

    activeBlock = {
      x: axis === 'x' ? -220 : top.x,
      z: axis === 'z' ? -220 : top.z,
      y: level,
      w: top.w,
      d: top.d,
      axis: axis,
      speed: speed,
      dir: 1,
      hue: getHue(level)
    };
  }

  function placeBlock() {
    if (!isRunning || !activeBlock) return;
    getAudio();

    var top = stack[stack.length - 1];
    var cur = activeBlock;
    var axis = cur.axis;

    var diff = (axis === 'x') ? (cur.x - top.x) : (cur.z - top.z);
    var tolerance = 3.2;

    if (Math.abs(diff) <= tolerance) {
      // Perfect placement!
      if (axis === 'x') cur.x = top.x;
      else cur.z = top.z;

      combo++;
      sfxPerfect(combo);

      if (combo >= 2) {
        comboChip.style.display = 'inline-block';
        comboChip.textContent = `PERFECT x${combo}!`;

        // Reward: expand block slightly
        if (axis === 'x') {
          cur.w = Math.min(BASE_SIZE, cur.w + 6);
          cur.x -= 3;
        } else {
          cur.d = Math.min(BASE_SIZE, cur.d + 6);
          cur.z -= 3;
        }
      }

      // Spawn glowing expanding 3D aura ring
      rings.push({
        x: cur.x,
        y: cur.y,
        z: cur.z,
        w: cur.w,
        d: cur.d,
        radius: 0,
        alpha: 1,
        color: `hsl(${cur.hue}, 90%, 65%)`
      });
    } else {
      combo = 0;
      comboChip.style.display = 'none';
      sfxDrop();

      if (axis === 'x') {
        var overlap = cur.w - Math.abs(diff);
        if (overlap <= 0) {
          // Complete Miss!
          slicedPieces.push({
            x: cur.x, y: cur.y, z: cur.z, w: cur.w, d: cur.d,
            vy: 0, rot: 0, vRot: 0.04, hue: cur.hue
          });
          gameOver();
          return;
        }

        // Slice block
        var sliceW = Math.abs(diff);
        var sliceX = (diff > 0) ? (cur.x + overlap) : (cur.x);
        cur.w = overlap;
        cur.x = (diff > 0) ? (cur.x) : (top.x);

        slicedPieces.push({
          x: sliceX, y: cur.y, z: cur.z, w: sliceW, d: cur.d,
          vy: 0, rot: 0, vRot: diff > 0 ? 0.05 : -0.05, hue: cur.hue
        });
      } else {
        // Z axis
        var overlapZ = cur.d - Math.abs(diff);
        if (overlapZ <= 0) {
          slicedPieces.push({
            x: cur.x, y: cur.y, z: cur.z, w: cur.w, d: cur.d,
            vy: 0, rot: 0, vRot: 0.04, hue: cur.hue
          });
          gameOver();
          return;
        }

        var sliceD = Math.abs(diff);
        var sliceZ = (diff > 0) ? (cur.z + overlapZ) : (cur.z);
        cur.d = overlapZ;
        cur.z = (diff > 0) ? (cur.z) : (top.z);

        slicedPieces.push({
          x: cur.x, y: cur.y, z: sliceZ, w: cur.w, d: sliceD,
          vy: 0, rot: 0, vRot: diff > 0 ? 0.05 : -0.05, hue: cur.hue
        });
      }
    }

    stack.push(cur);
    score = stack.length - 1;
    scoreDisplay.textContent = score;

    // Camera moves up with each placed block
    targetCameraY = score * BLOCK_HEIGHT;

    spawnBlock(stack.length);
  }

  function gameOver() {
    isRunning = false;
    activeBlock = null;
    sfxGameOver();

    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('dk:stack-best', String(bestScore)); } catch(e) {}
      bestDisplay.textContent = bestScore;
    }

    finalScore.textContent = score;
    finalBest.textContent = bestScore;
    statsSummary.style.display = 'grid';
    overlay.classList.remove('hidden');

    try {
      window.parent.postMessage({ type: 'dk:gameover', score: score }, '*');
    } catch(e) {}
  }

  function startGame() {
    getAudio();
    overlay.classList.add('hidden');
    initGame();
    isRunning = true;
  }
  startBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });

  // Controls: Click, Touch, Spacebar
  wrap.addEventListener('pointerdown', function(e) {
    if (e.target.closest('#overlay') || e.target.closest('.btn')) return;
    if (!isRunning) startGame();
    else placeBlock();
  });

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!isRunning) startGame();
      else placeBlock();
    }
  });

  // Parent bus
  window.addEventListener('message', function(e) {
    var data = e.data || {};
    if (data.type === 'dk:restart') startGame();
    else if (data.type === 'dk:keydown' && data.code === 'Space') {
      if (!isRunning) startGame();
      else placeBlock();
    } else if (data.type === 'dk:resize') {
      resize();
    }
  });

  // Update
  function update() {
    if (isRunning && activeBlock) {
      if (activeBlock.axis === 'x') {
        activeBlock.x += activeBlock.speed * activeBlock.dir;
        if (activeBlock.x > 220) activeBlock.dir = -1;
        else if (activeBlock.x < -220) activeBlock.dir = 1;
      } else {
        activeBlock.z += activeBlock.speed * activeBlock.dir;
        if (activeBlock.z > 220) activeBlock.dir = -1;
        else if (activeBlock.z < -220) activeBlock.dir = 1;
      }
    }

    // Camera smoothing
    cameraY += (targetCameraY - cameraY) * 0.1;

    // Falling 3D Slices
    for (var i = slicedPieces.length - 1; i >= 0; i--) {
      var p = slicedPieces[i];
      p.vy += 0.45; // gravity
      p.y -= p.vy * 0.1;
      p.rot += p.vRot;

      if (p.y * BLOCK_HEIGHT < -200) {
        slicedPieces.splice(i, 1);
      }
    }

    // Expanding 3D Rings
    for (var r = rings.length - 1; r >= 0; r--) {
      var rg = rings[r];
      rg.radius += 3.5;
      rg.alpha -= 0.035;
      if (rg.alpha <= 0) rings.splice(r, 1);
    }
  }

  // 3D Isometric Drawing Routine
  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);

    // Dynamic Altitude Sky Background
    var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    var hue = (score * 6 + 210) % 360;
    bgGrad.addColorStop(0, `hsl(${hue}, 40%, 12%)`);
    bgGrad.addColorStop(0.5, `hsl(${hue}, 35%, 8%)`);
    bgGrad.addColorStop(1, '#070a12');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Subtle atmospheric stars at higher score
    if (score > 15) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (var s = 0; s < 30; s++) {
        var sx = (s * 73) % W;
        var sy = (s * 97) % H;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }
    }

    // 1. Draw Stack Blocks in 3D Isometric Projection
    // Draw from bottom to top
    for (var i = 0; i < stack.length; i++) {
      var b = stack[i];
      draw3DBlock(b.x, b.y, b.z, b.w, b.d, b.hue, 1.0);
    }

    // 2. Draw Falling 3D Sliced Pieces
    for (var j = 0; j < slicedPieces.length; j++) {
      var sp = slicedPieces[j];
      draw3DBlock(sp.x, sp.y, sp.z, sp.w, sp.d, sp.hue, 0.85);
    }

    // 3. Draw Active Sliding Block
    if (activeBlock) {
      draw3DBlock(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, activeBlock.d, activeBlock.hue, 1.0);
    }

    // 4. Draw Perfect Placement Aura Rings
    for (var k = 0; k < rings.length; k++) {
      var ring = rings[k];
      draw3DRing(ring);
    }

    ctx.restore();
  }

  function draw3DBlock(x, y, z, w, d, hue, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;

    // 8 3D Vertices projected to 2D screen
    // Top face corners:
    var pTopNear  = toScreen(x + w, y, z + d); // Front corner
    var pTopLeft  = toScreen(x, y, z + d);     // Left corner
    var pTopRight = toScreen(x + w, y, z);     // Right corner
    var pTopFar   = toScreen(x, y, z);         // Back corner

    var bH = BLOCK_HEIGHT;

    // Colors:
    // Top face: bright illuminated pastel
    var topColor   = `hsl(${hue}, 85%, 68%)`;
    // Left face: medium shade
    var leftColor  = `hsl(${hue}, 75%, 52%)`;
    // Right face: darker shaded side
    var rightColor = `hsl(${hue}, 70%, 40%)`;

    // 1. Front-Left Face
    ctx.fillStyle = leftColor;
    ctx.beginPath();
    ctx.moveTo(pTopLeft.x, pTopLeft.y);
    ctx.lineTo(pTopNear.x, pTopNear.y);
    ctx.lineTo(pTopNear.x, pTopNear.y + bH);
    ctx.lineTo(pTopLeft.x, pTopLeft.y + bH);
    ctx.closePath();
    ctx.fill();

    // 2. Front-Right Face
    ctx.fillStyle = rightColor;
    ctx.beginPath();
    ctx.moveTo(pTopNear.x, pTopNear.y);
    ctx.lineTo(pTopRight.x, pTopRight.y);
    ctx.lineTo(pTopRight.x, pTopRight.y + bH);
    ctx.lineTo(pTopNear.x, pTopNear.y + bH);
    ctx.closePath();
    ctx.fill();

    // 3. Top Face (Diamond)
    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(pTopFar.x, pTopFar.y);
    ctx.lineTo(pTopRight.x, pTopRight.y);
    ctx.lineTo(pTopNear.x, pTopNear.y);
    ctx.lineTo(pTopLeft.x, pTopLeft.y);
    ctx.closePath();
    ctx.fill();

    // Highlight border on top face
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  function draw3DRing(rg) {
    ctx.save();
    ctx.globalAlpha = rg.alpha;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = 3;

    var extra = rg.radius;
    var pFar   = toScreen(rg.x - extra, rg.y, rg.z - extra);
    var pRight = toScreen(rg.x + rg.w + extra, rg.y, rg.z - extra);
    var pNear  = toScreen(rg.x + rg.w + extra, rg.y, rg.z + rg.d + extra);
    var pLeft  = toScreen(rg.x - extra, rg.y, rg.z + rg.d + extra);

    ctx.beginPath();
    ctx.moveTo(pFar.x, pFar.y);
    ctx.lineTo(pRight.x, pRight.y);
    ctx.lineTo(pNear.x, pNear.y);
    ctx.lineTo(pLeft.x, pLeft.y);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  initGame();
})();
</script>
</body>
</html>
