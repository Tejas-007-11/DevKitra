<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="b5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg-grad)"/>

  <!-- Isometric Perspective Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5">
    <line x1="50" y1="400" x2="300" y2="100"/>
    <line x1="150" y1="400" x2="300" y2="100"/>
    <line x1="250" y1="400" x2="300" y2="100"/>
    <line x1="350" y1="400" x2="300" y2="100"/>
    <line x1="450" y1="400" x2="300" y2="100"/>
    <line x1="550" y1="400" x2="300" y2="100"/>
    <line x1="100" y1="360" x2="500" y2="360"/>
    <line x1="160" y1="300" x2="440" y2="300"/>
    <line x1="210" y1="240" x2="390" y2="240"/>
  </g>

  <!-- Tower Blocks stacked vertically -->
  <!-- Base block -->
  <g filter="url(#neon-glow)">
    <rect x="180" y="330" width="240" height="34" rx="6" fill="url(#b1)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="185" y="332" width="230" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

    <!-- Block 2 -->
    <rect x="195" y="285" width="210" height="34" rx="6" fill="url(#b2)" stroke="#818cf8" stroke-width="2"/>
    <rect x="200" y="287" width="200" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

    <!-- Block 3 -->
    <rect x="210" y="240" width="180" height="34" rx="6" fill="url(#b3)" stroke="#c084fc" stroke-width="2"/>
    <rect x="215" y="242" width="170" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

    <!-- Block 4 -->
    <rect x="230" y="195" width="150" height="34" rx="6" fill="url(#b4)" stroke="#f472b6" stroke-width="2"/>
    <rect x="235" y="197" width="140" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

    <!-- Slicing falling off-cut -->
    <g transform="translate(390, 200) rotate(15)">
      <rect x="0" y="0" width="30" height="34" rx="4" fill="url(#b4)" opacity="0.6"/>
    </g>

    <!-- Moving Block (Top Active) -->
    <rect x="250" y="150" width="130" height="34" rx="6" fill="url(#b5)" stroke="#fb923c" stroke-width="2"/>
    <rect x="255" y="152" width="120" height="6" rx="3" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Sparkles / Combo Starburst -->
  <g fill="#fef08a" filter="url(#neon-glow)">
    <circle cx="230" cy="195" r="4"/>
    <circle cx="380" cy="195" r="5"/>
    <circle cx="395" cy="210" r="3"/>
    <circle cx="210" cy="240" r="3"/>
  </g>

  <!-- Perfect combo badge -->
  <g transform="translate(300, 95)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#fbbf24" letter-spacing="2">PERFECT x3</text>
  </g>
</svg>
