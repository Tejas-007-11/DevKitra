<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="road-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="40%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="neon-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#road-grad)"/>

  <!-- Horizon Grid Lines -->
  <g stroke="rgba(244, 63, 94, 0.12)" stroke-width="1">
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="310" x2="600" y2="310"/>
  </g>

  <!-- Highway Surface -->
  <polygon points="220,150 380,150 540,390 60,390" fill="#070c1a"/>

  <!-- Neon Highway Guard Rails -->
  <line x1="220" y1="150" x2="60" y2="390" stroke="#f43f5e" stroke-width="4" filter="url(#neon-rose)"/>
  <line x1="380" y1="150" x2="540" y2="390" stroke="#f43f5e" stroke-width="4" filter="url(#neon-rose)"/>

  <!-- Lane Markings -->
  <line x1="273" y1="150" x2="220" y2="390" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="14,14" opacity="0.6"/>
  <line x1="327" y1="150" x2="380" y2="390" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="14,14" opacity="0.6"/>

  <!-- Hazard Barricade in Distance -->
  <rect x="195" y="220" width="45" height="18" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" filter="url(#neon-rose)"/>

  <!-- Glowing Energy Orb in Right Lane -->
  <circle cx="365" cy="245" r="14" fill="#38bdf8" filter="url(#neon-cyan)"/>
  <circle cx="365" cy="245" r="7" fill="#ffffff"/>

  <!-- Player Speed Vehicle -->
  <g transform="translate(300, 335)" filter="url(#neon-cyan)">
    <!-- Plasma Exhaust -->
    <polygon points="-12,12 0,32 12,12" fill="#0ea5e9"/>
    <!-- Hull -->
    <polygon points="0,-24 32,12 16,9 0,14 -16,9 -32,12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <ellipse cx="0" cy="-4" rx="7" ry="12" fill="#38bdf8"/>
  </g>

  <!-- Speed Badge -->
  <g transform="translate(300, 65)">
    <rect x="-80" y="-16" width="160" height="32" rx="16" fill="rgba(13, 19, 34, 0.85)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#f43f5e" letter-spacing="2">WARP SPEED</text>
  </g>
</svg>
