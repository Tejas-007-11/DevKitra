<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Breakout — DevKitra Gaming</title>
<meta name="description" content="Bounce the ball off the paddle and clear every brick. Play Breakout instantly in your browser." />
<link rel="canonical" href="https://devkitra.in/game/breakout" />
<style>
* { box-sizing: border-box; }
:root {
  --ink: #07090e;
  --panel: #0d121c;
  --line: #1c2638;
  --text: #e8edf5;
  --muted: #7e8b9f;
  --accent: #8b5cf6;
  --accent-glow: rgba(139, 92, 246, 0.3);
  --paddle: #00f0ff;
}
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
header { width: 100%; max-width: 440px; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.5rem 0 0.8rem; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.15rem; letter-spacing: -0.02em; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
h1::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
a.back { color: var(--muted); text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid var(--line); transition: all 0.15s ease; }
a.back:hover { color: var(--text); border-color: var(--accent); background: rgba(139, 92, 246, 0.08); }
#wrap { position: relative; max-width: 440px; width: 100%; border-radius: 14px; padding: 0.75rem; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6); transition: transform 0.05s ease; }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; font-variant-numeric: tabular-nums; }
.hud b { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem; }
.hud-lives { display: flex; align-items: center; gap: 4px; }
.heart { color: #ff3366; font-size: 0.9rem; }
canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #070a10; border: 1px solid var(--line); cursor: none; }
.overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(7, 9, 14, 0.92); backdrop-filter: blur(4px); border-radius: 14px; z-index: 10; text-align: center; padding: 1.5rem; }
.overlay h2 { margin: 0 0 0.4rem; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.03em; color: var(--text); }
.overlay p { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.88rem; max-width: 280px; line-height: 1.5; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 0.65rem 1.4rem; font-weight: 800; cursor: pointer; font-size: 0.95rem; box-shadow: 0 0 20px var(--accent-glow); transition: all 0.15s ease; }
.btn:hover { background: #9d74f8; transform: translateY(-1px); box-shadow: 0 0 25px rgba(139, 92, 246, 0.5); }
.hint { margin-top: 0.75rem; font-size: 0.78rem; color: var(--muted); text-align: center; }
@media (max-width: 440px) { header { padding: 0.4rem 0 0.6rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<header>
  <h1>Breakout</h1>
  <a class="back" href="/game/breakout">← Library</a>
</header>
<div id="wrap">
  <div class="hud">
    <div>Score <b id="score">0</b></div>
    <div class="hud-lives">Lives <b id="lives">3</b></div>
  </div>
  <canvas id="game" width="400" height="500"></canvas>
  <div id="start" class="overlay">
    <h2>Neon Breakout</h2>
    <p>Bounce the laser orb off the paddle and shatter every brick.</p>
    <button class="btn" id="start-btn">Start Game</button>
  </div>
  <div id="over" class="overlay">
    <h2 id="over-title">Game Over</h2>
    <p id="over-text">Final score: <b id="final-score" style="color:var(--accent);">0</b></p>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
  <div id="pause" class="overlay">
    <h2>Paused</h2>
    <p>Press Pause or spacebar to resume.</p>
  </div>
  <p class="hint">Mouse, touch, or Left/Right Arrow keys to move paddle.</p>
</div>
<script>
/* Simple Web Audio synth sound generator */
let audioCtx = null;
function playSound(type, freq = 440) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'hit') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'brick') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'lose') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.25);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch (_) {}
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const startEl = document.getElementById('start');
const overEl = document.getElementById('over');
const overTitle = document.getElementById('over-title');
const finalScoreEl = document.getElementById('final-score');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const wrapEl = document.getElementById('wrap');

function post(payload) {
  if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
}
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'dk:restart') { resetGame(); paused = false; }
  if (event.data && event.data.type === 'dk:pause') pauseGame();
  if (event.data && event.data.type === 'dk:resume') resumeGame();
});

const PADDLE_W = 90;
const PADDLE_H = 12;
const BALL_R = 6;
const BRICK_ROWS = 4;
const BRICK_COLS = 10;
const BRICK_H = 20;
const BRICK_GAP = 6;
const BRICK_TOP = 45;

let score, lives, running, animId, paused = false;
let paddleX, balls, bricks;
let keys = {};
let particles = [];
let floaters = [];

const embed = new URLSearchParams(window.location.search).has('embed');
if (embed) { document.querySelector('header')?.remove(); wrapEl.style.padding = '0.5rem'; }

function shakeScreen() {
  wrapEl.style.transform = 'translate(-3px, 2px)';
  setTimeout(() => { wrapEl.style.transform = 'translate(3px, -2px)'; }, 40);
  setTimeout(() => { wrapEl.style.transform = 'translate(0, 0)'; }, 90);
}

function spawnDebris(x, y, w, h, color) {
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3.5;
    particles.push({
      x: x + Math.random() * w,
      y: y + Math.random() * h,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      size: 2 + Math.random() * 3,
      alpha: 1,
      color,
    });
  }
}

function spawnFloater(text, x, y, color) {
  floaters.push({ text, x, y, alpha: 1, vy: -1.2, color });
}

function resetGame() {
  score = 0;
  lives = 3;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  paddleX = (canvas.width - PADDLE_W) / 2;
  balls = [{ x: canvas.width / 2, y: canvas.height - 40, vx: 3.2, vy: -4.2, trail: [] }];
  particles = [];
  floaters = [];
  buildBricks();
  running = false;
  startEl.style.display = 'flex';
  overEl.style.display = 'none';
  post({ type: 'dk:ready', id: 'breakout', title: 'Breakout' });
  draw();
}

function buildBricks() {
  bricks = [];
  const colors = ['#ff3366', '#ff8800', '#f59e0b', '#00f0ff'];
  const totalW = BRICK_COLS * 34 + (BRICK_COLS - 1) * BRICK_GAP;
  const offsetX = (canvas.width - totalW) / 2;
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({
        x: offsetX + c * (34 + BRICK_GAP),
        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
        w: 34,
        h: BRICK_H,
        alive: true,
        color: colors[r],
        points: (BRICK_ROWS - r) * 10,
      });
    }
  }
}

function rectIntersectsCircle(rx, ry, rw, rh, cx, cy, r) {
  const nearestX = Math.max(rx, Math.min(cx, rx + rw));
  const nearestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nearestX;
  const dy = cy - nearestY;
  return dx * dx + dy * dy <= r * r;
}

function resetBall() {
  balls = [{ x: canvas.width / 2, y: canvas.height - 40, vx: (Math.random() > 0.5 ? 3 : -3), vy: -4, trail: [] }];
}

function tick() {
  if (!running || paused) return;

  if (keys['ArrowLeft'] || keys['KeyA']) paddleX -= 7;
  if (keys['ArrowRight'] || keys['KeyD']) paddleX += 7;
  paddleX = Math.max(0, Math.min(canvas.width - PADDLE_W, paddleX));

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.trail.unshift({ x: b.x, y: b.y });
    if (b.trail.length > 7) b.trail.pop();

    b.x += b.vx;
    b.y += b.vy;

    if (b.x - BALL_R < 0) { b.x = BALL_R; b.vx *= -1; playSound('hit', 300); }
    if (b.x + BALL_R > canvas.width) { b.x = canvas.width - BALL_R; b.vx *= -1; playSound('hit', 300); }
    if (b.y - BALL_R < 0) { b.y = BALL_R; b.vy *= -1; playSound('hit', 360); }

    const paddleTop = canvas.height - 28;
    if (b.y + BALL_R > paddleTop && b.y - BALL_R < paddleTop + PADDLE_H &&
        b.x > paddleX && b.x < paddleX + PADDLE_W && b.vy > 0) {
      const hitPos = (b.x - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
      b.vx = hitPos * 5.5;
      b.vy = -Math.abs(b.vy);
      if (Math.abs(b.vx) < 1) b.vx = b.vx >= 0 ? 1.8 : -1.8;
      b.y = paddleTop - BALL_R;
      playSound('hit', 400 + hitPos * 150);
    }

    for (const brick of bricks) {
      if (!brick.alive) continue;
      if (rectIntersectsCircle(brick.x, brick.y, brick.w, brick.h, b.x, b.y, BALL_R)) {
        brick.alive = false;
        score += brick.points;
        scoreEl.textContent = score;
        spawnDebris(brick.x, brick.y, brick.w, brick.h, brick.color);
        spawnFloater(`+${brick.points}`, brick.x + brick.w / 2, brick.y, brick.color);
        playSound('brick', 520 + brick.points * 8);

        const prevVy = b.vy;
        b.vy = -b.vy * 1.02;
        b.vx = b.vx * 1.02;
        if (Math.abs(b.vy) < 2) b.vy = prevVy > 0 ? 2.5 : -2.5;
        break;
      }
    }

    if (b.y + BALL_R > canvas.height) {
      balls.splice(i, 1);
      if (balls.length === 0) {
        lives--;
        livesEl.textContent = lives;
        playSound('lose');
        shakeScreen();
        if (lives <= 0) endGame(false);
        else resetBall();
      }
    }
  }

  if (bricks.every((b) => !b.alive)) endGame(true);
}

function endGame(won) {
  running = false;
  paused = false;
  overTitle.textContent = won ? 'Victory — Cleared!' : 'Game Over';
  finalScoreEl.textContent = score;
  overEl.style.display = 'flex';
  post({ type: 'dk:gameover', score });
}

function pauseGame() {
  if (!running || paused) return;
  paused = true;
  document.getElementById('pause').style.display = 'flex';
}

function resumeGame() {
  if (!paused) return;
  paused = false;
  document.getElementById('pause').style.display = 'none';
}

function draw() {
  ctx.fillStyle = '#070a10';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* Brick rendering with 3D gradient/bezel */
  for (const brick of bricks) {
    if (!brick.alive) continue;
    ctx.fillStyle = brick.color;
    ctx.beginPath();
    ctx.roundRect(brick.x, brick.y, brick.w, brick.h, 3);
    ctx.fill();

    /* Highlight top line */
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(brick.x + 1, brick.y + 1, brick.w - 2, 2);
  }

  /* Paddle with laser cyan glow */
  ctx.save();
  ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
  ctx.roundRect(paddleX - 4, canvas.height - 32, PADDLE_W + 8, PADDLE_H + 8, 6);
  ctx.fill();
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.roundRect(paddleX, canvas.height - 28, PADDLE_W, PADDLE_H, 4);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(paddleX + 6, canvas.height - 27, PADDLE_W - 12, 2);
  ctx.restore();

  /* Balls with motion trails */
  for (const b of balls) {
    /* Trail */
    b.trail.forEach((pt, idx) => {
      const alpha = (1 - idx / b.trail.length) * 0.35;
      const r = BALL_R * (1 - idx / b.trail.length * 0.5);
      ctx.fillStyle = `rgba(139, 92, 246, ${alpha})`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
      ctx.fill();
    });

    /* Ball core */
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(139, 92, 246, 0.4)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R + 3, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Particles */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08; /* gravity */
    p.alpha -= 0.025;
    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();
  }

  /* Floaters */
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy;
    f.alpha -= 0.025;
    if (f.alpha <= 0) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = f.alpha;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 12px ui-monospace, monospace';
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

function loop() {
  tick();
  draw();
  animId = requestAnimationFrame(loop);
}

function startLoop() {
  running = true;
  startEl.style.display = 'none';
  overEl.style.display = 'none';
  post({ type: 'dk:ready', id: 'breakout', title: 'Breakout' });
}

window.addEventListener('keydown', (event) => {
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
  if (event.code === 'Space') {
    if (!running) startLoop();
    else if (paused) resumeGame();
    else pauseGame();
    return;
  }
  keys[event.code] = true;
});
window.addEventListener('keyup', (event) => { keys[event.code] = false; });

canvas.addEventListener('mousemove', (event) => {
  const rect = canvas.getBoundingClientRect();
  paddleX = event.clientX - rect.left - PADDLE_W / 2;
});
canvas.addEventListener('touchmove', (event) => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  paddleX = event.touches[0].clientX - rect.left - PADDLE_W / 2;
}, { passive: false });
canvas.addEventListener('pointerdown', () => { if (!running) startLoop(); });
canvas.addEventListener('touchstart', () => { if (!running) startLoop(); }, { passive: false });

startBtn.addEventListener('click', startLoop);
restartBtn.addEventListener('click', () => { resetGame(); startLoop(); });

resetGame();
loop();
post({ type: 'dk:ready', id: 'breakout', title: 'Breakout' });
</script>
</body>
</html>
