<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Breakout — Devkitra Gaming</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .hud-bar {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .hud-chip {
      background: #151b28;
      border: 1px solid #283347;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hud-chip b {
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .lives-chip b {
      color: #ef4444;
    }
    #canvas-wrap {
      position: relative;
      background: #0f1422;
      border: 3px solid #283347;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
      cursor: default;
    }
    .overlay.hidden { display: none; }
    .card-modal {
      background: #151b28;
      border: 1px solid #2d374d;
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-icon {
      font-size: 46px;
      margin-bottom: 8px;
    }
    .card-modal h2 {
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .card-modal p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .stats-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .stat-mini-box {
      background: #0f1420;
      border: 1px solid #252e42;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .stat-mini-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
    }
    .stat-mini-val {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
    }
    .btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      transition: all 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .aim-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud-bar">
      <div class="hud-chip">Stage: <b id="stage-display">1 / 4</b></div>
      <div class="hud-chip">Score: <b id="score-display">0</b></div>
      <div class="hud-chip lives-chip">Lives: <b id="lives-display">❤❤❤</b></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="breakoutCanvas"></canvas>

      <div id="overlay" class="overlay">
        <div class="card-modal">
          <div class="modal-icon">🧱</div>
          <h2 id="overlay-heading">BREAKOUT</h2>
          <p id="overlay-desc">Deflect the ball, shatter multi-layer bricks, catch dropping powerups, and clear all 4 challenge stages!</p>
          <div class="stats-summary" id="stats-summary" style="display:none;">
            <div class="stat-mini-box">
              <div class="stat-mini-label">Score</div>
              <div class="stat-mini-val" id="final-score">0</div>
            </div>
            <div class="stat-mini-box">
              <div class="stat-mini-label">Stage</div>
              <div class="stat-mini-val" id="final-stage">1</div>
            </div>
          </div>
          <button id="start-btn" class="btn">START GAME</button>
        </div>
      </div>
    </div>

    <div class="aim-hint">Move mouse, touch & drag, or use Arrow Left/Right to steer paddle.</div>
  </div>

  <script>
    (function() {
      // Audio synth
      var audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch(e) {}
        }
        return audioCtx;
      }
      function playTone(freq, type, dur, gainVal, endFreq) {
        var actx = getAudio();
        if (!actx) return;
        try {
          var osc = actx.createOscillator();
          var gain = actx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + dur);
          gain.gain.setValueAtTime(gainVal || 0.08, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + dur);
        } catch(e) {}
      }

      function sfxPaddle() { playTone(360, 'sine', 0.06, 0.09, 440); }
      function sfxWall() { playTone(240, 'sine', 0.04, 0.05); }
      function sfxBrick(pitch) { playTone(440 + pitch * 40, 'triangle', 0.08, 0.09, 580); }
      function sfxPowerup() {
        playTone(520, 'sine', 0.08, 0.08, 780);
        setTimeout(function() { playTone(780, 'sine', 0.14, 0.08, 1040); }, 50);
      }
      function sfxLifeLost() { playTone(180, 'triangle', 0.25, 0.12, 80); }

      var canvas = document.getElementById('breakoutCanvas');
      var ctx = canvas.getContext('2d');
      var stageDisplay = document.getElementById('stage-display');
      var scoreDisplay = document.getElementById('score-display');
      var livesDisplay = document.getElementById('lives-display');
      var overlay = document.getElementById('overlay');
      var overlayHeading = document.getElementById('overlay-heading');
      var overlayDesc = document.getElementById('overlay-desc');
      var statsSummary = document.getElementById('stats-summary');
      var finalScore = document.getElementById('final-score');
      var finalStage = document.getElementById('final-stage');
      var startBtn = document.getElementById('start-btn');

      var W = 520;
      var H = 640;
      var dpr = 1;

      function resize() {
        var wrap = document.getElementById('game-container');
        var maxH = (wrap.clientHeight || window.innerHeight) - 80;
        var maxW = (wrap.clientWidth || window.innerWidth) - 40;

        var targetH = Math.min(maxH, 720);
        var targetW = Math.min(maxW, Math.floor(targetH * (520 / 640)));

        W = targetW;
        H = targetH;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        ctx.resetTransform?.();
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      var isRunning = false;
      var isPaused = false;
      var currentStage = 1;
      var totalStages = 4;
      var score = 0;
      var lives = 3;

      var paddle = {
        x: W / 2 - 45,
        y: H - 36,
        w: 90,
        h: 14,
        targetX: W / 2 - 45,
        speed: 8
      };

      var balls = [];
      var bricks = [];
      var powerups = [];
      var particles = [];
      var callouts = [];
      var screenShake = 0;

      function initStage(sNum) {
        currentStage = sNum;
        stageDisplay.textContent = currentStage + ' / ' + totalStages;

        paddle.w = 90;
        paddle.x = W / 2 - paddle.w / 2;
        paddle.y = H - 36;
        paddle.targetX = paddle.x;

        balls = [{
          x: W / 2,
          y: H - 56,
          vx: (Math.random() > 0.5 ? 1 : -1) * (3.5 + sNum * 0.4),
          vy: -(4.5 + sNum * 0.4),
          r: 7,
          fireball: false
        }];

        powerups = [];
        particles = [];
        callouts = [];

        buildBricks(sNum);
        updateLivesUI();
      }

      function buildBricks(sNum) {
        bricks = [];
        var rows = 4 + sNum;
        var cols = 8;
        var padding = 6;
        var brickW = (W - (padding * (cols + 1))) / cols;
        var brickH = 18;
        var startY = 40;

        var palette = [
          { main: '#ef4444', light: '#fca5a5', pts: 40 },
          { main: '#f97316', light: '#fdba74', pts: 30 },
          { main: '#eab308', light: '#fef08a', pts: 20 },
          { main: '#22c55e', light: '#86efac', pts: 10 },
          { main: '#3b82f6', light: '#93c5fd', pts: 10 },
          { main: '#a855f7', light: '#d8b4fe', pts: 20 }
        ];

        for (var r = 0; r < rows; r++) {
          var colorInfo = palette[r % palette.length];
          var hp = (sNum >= 3 && r < 2) ? 2 : 1;

          for (var c = 0; c < cols; c++) {
            if (sNum === 2 && (r + c) % 2 === 1) continue; // Checkerboard stage 2
            if (sNum === 4 && (c === 0 || c === cols - 1 || r === 0)) hp = 2; // Fortress

            bricks.push({
              x: padding + c * (brickW + padding),
              y: startY + r * (brickH + padding),
              w: brickW,
              h: brickH,
              color: colorInfo.main,
              light: colorInfo.light,
              pts: colorInfo.pts,
              hp: hp,
              maxHp: hp
            });
          }
        }
      }

      function updateLivesUI() {
        var str = '';
        for (var i = 0; i < lives; i++) str += '❤';
        livesDisplay.textContent = str || 'None';
      }

      // Input Controls
      canvas.addEventListener('mousemove', function(e) {
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        paddle.targetX = mx - paddle.w / 2;
      });

      canvas.addEventListener('touchmove', function(e) {
        if (!e.touches.length) return;
        var rect = canvas.getBoundingClientRect();
        var tx = e.touches[0].clientX - rect.left;
        paddle.targetX = tx - paddle.w / 2;
      }, { passive: true });

      var keys = {};
      window.addEventListener('keydown', function(e) {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
        else if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
        else if (e.code === 'Space' && !isRunning) { e.preventDefault(); startGame(); }
      });
      window.addEventListener('keyup', function(e) {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
        else if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      });

      function gameOver(victory) {
        isRunning = false;
        try {
          window.parent.postMessage({ type: 'dk:gameover', score: score }, '*');
        } catch(e) {}

        overlayHeading.textContent = victory ? 'CHAMPION!' : 'GAME OVER';
        overlayDesc.textContent = victory
          ? 'Brilliant paddle mastery! You cleared all 4 challenge stages.'
          : 'All lives lost! Keep your eye on the ball trajectory.';
        finalScore.textContent = score;
        finalStage.textContent = currentStage;
        statsSummary.style.display = 'grid';
        startBtn.textContent = 'PLAY AGAIN';
        overlay.classList.remove('hidden');
      }

      function startGame() {
        getAudio();
        overlay.classList.add('hidden');
        score = 0;
        lives = 3;
        scoreDisplay.textContent = '0';
        initStage(1);
        isRunning = true;
      }
      startBtn.addEventListener('click', startGame);

      // Devkitra messages
      window.addEventListener('message', function(e) {
        var data = e.data || {};
        if (data.type === 'dk:restart') startGame();
        else if (data.type === 'dk:pause') isPaused = true;
        else if (data.type === 'dk:resume') isPaused = false;
        else if (data.type === 'dk:resize') resize();
      });

      // Update
      function update() {
        if (screenShake > 0) screenShake *= 0.86;
        if (screenShake < 0.1) screenShake = 0;

        if (isRunning && !isPaused) {
          // Paddle Keyboard
          if (keys.left) paddle.targetX -= paddle.speed;
          if (keys.right) paddle.targetX += paddle.speed;

          // Paddle Lerp
          paddle.x += (paddle.targetX - paddle.x) * 0.35;
          if (paddle.x < 4) paddle.x = 4;
          if (paddle.x > W - paddle.w - 4) paddle.x = W - paddle.w - 4;

          // Balls
          for (var b = balls.length - 1; b >= 0; b--) {
            var ball = balls[b];
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Walls
            if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = -ball.vx; sfxWall(); }
            else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -ball.vx; sfxWall(); }

            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; sfxWall(); }

            // Paddle bounce
            if (ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h) {
              if (ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r && ball.vy > 0) {
                ball.vy = -Math.abs(ball.vy);
                // Angle ball based on where it hit paddle
                var hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                ball.vx = hitOffset * 6.5;
                sfxPaddle();

                // Spark burst
                for (var sp = 0; sp < 6; sp++) {
                  particles.push({
                    x: ball.x,
                    y: paddle.y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 3,
                    color: '#38bdf8',
                    size: 3,
                    life: 1
                  });
                }
              }
            }

            // Brick collisions
            for (var k = bricks.length - 1; k >= 0; k--) {
              var br = bricks[k];
              if (ball.x + ball.r > br.x && ball.x - ball.r < br.x + br.w &&
                  ball.y + ball.r > br.y && ball.y - ball.r < br.y + br.h) {

                br.hp--;
                sfxBrick(currentStage);

                if (br.hp <= 0) {
                  score += br.pts;
                  scoreDisplay.textContent = score;

                  // Shatter particles
                  for (var p = 0; p < 8; p++) {
                    particles.push({
                      x: br.x + br.w / 2,
                      y: br.y + br.h / 2,
                      vx: (Math.random() - 0.5) * 5,
                      vy: (Math.random() - 0.5) * 5,
                      color: br.color,
                      size: Math.random() * 4 + 2,
                      life: 1
                    });
                  }

                  // Drop powerup chance
                  if (Math.random() < 0.22) {
                    var puType = ['multiball', 'wide', 'fireball'][Math.floor(Math.random() * 3)];
                    powerups.push({
                      x: br.x + br.w / 2,
                      y: br.y + br.h / 2,
                      type: puType,
                      vy: 2.2
                    });
                  }

                  bricks.splice(k, 1);
                }

                if (!ball.fireball) {
                  ball.vy = -ball.vy;
                }
                break;
              }
            }

            // Ball fell past bottom
            if (ball.y - ball.r > H) {
              balls.splice(b, 1);
            }
          }

          // If no balls left
          if (balls.length === 0) {
            lives--;
            updateLivesUI();
            sfxLifeLost();
            screenShake = 12;

            if (lives <= 0) {
              gameOver(false);
              return;
            } else {
              // Respawn ball
              balls.push({
                x: paddle.x + paddle.w / 2,
                y: paddle.y - 12,
                vx: (Math.random() > 0.5 ? 1 : -1) * 4,
                vy: -5,
                r: 7,
                fireball: false
              });
            }
          }

          // Powerups update
          for (var u = powerups.length - 1; u >= 0; u--) {
            var pu = powerups[u];
            pu.y += pu.vy;

            // Catch powerup
            if (pu.y >= paddle.y && pu.y <= paddle.y + paddle.h &&
                pu.x >= paddle.x && pu.x <= paddle.x + paddle.w) {

              sfxPowerup();
              if (pu.type === 'multiball') {
                balls.push({
                  x: paddle.x + paddle.w / 2,
                  y: paddle.y - 12,
                  vx: -4,
                  vy: -5,
                  r: 7,
                  fireball: false
                });
                balls.push({
                  x: paddle.x + paddle.w / 2,
                  y: paddle.y - 12,
                  vx: 4,
                  vy: -5,
                  r: 7,
                  fireball: false
                });
                callouts.push({ text: '● MULTIBALL! ●', x: paddle.x + paddle.w / 2, y: paddle.y - 20, color: '#38bdf8', life: 1 });
              } else if (pu.type === 'wide') {
                paddle.w = Math.min(150, paddle.w + 35);
                callouts.push({ text: '⇔ WIDE PADDLE! ⇔', x: paddle.x + paddle.w / 2, y: paddle.y - 20, color: '#22c55e', life: 1 });
              } else if (pu.type === 'fireball') {
                balls.forEach(function(bl) { bl.fireball = true; });
                callouts.push({ text: '🔥 FIREBALL! 🔥', x: paddle.x + paddle.w / 2, y: paddle.y - 20, color: '#f59e0b', life: 1 });
              }
              powerups.splice(u, 1);
              continue;
            }

            if (pu.y > H + 20) powerups.splice(u, 1);
          }

          // Stage Clear Check
          if (bricks.length === 0) {
            if (currentStage < totalStages) {
              initStage(currentStage + 1);
            } else {
              gameOver(true);
              return;
            }
          }
        }

        // Particles
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.life -= 0.035;
          if (pt.life <= 0) particles.splice(p, 1);
        }

        // Callouts
        for (var c = callouts.length - 1; c >= 0; c--) {
          var cl = callouts[c];
          cl.y -= 0.6;
          cl.life -= 0.025;
          if (cl.life <= 0) callouts.splice(c, 1);
        }
      }

      // Drawing
      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);

        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        // Draw Bricks
        for (var i = 0; i < bricks.length; i++) {
          var br = bricks[i];
          draw3DBrick(br);
        }

        // Draw Paddle
        drawPaddle(paddle.x, paddle.y, paddle.w, paddle.h);

        // Draw Balls
        for (var b = 0; b < balls.length; b++) {
          var ball = balls[b];
          drawBall(ball);
        }

        // Draw Powerups
        for (var u = 0; u < powerups.length; u++) {
          drawPowerup(powerups[u]);
        }

        // Draw Particles
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw Callouts
        for (var c = 0; c < callouts.length; c++) {
          var cl = callouts[c];
          ctx.save();
          ctx.globalAlpha = Math.max(0, cl.life);
          ctx.font = '900 16px -apple-system, sans-serif';
          ctx.fillStyle = cl.color;
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 6;
          ctx.fillText(cl.text, cl.x, cl.y);
          ctx.restore();
        }

        ctx.restore();
      }

      function draw3DBrick(br) {
        ctx.save();
        ctx.translate(br.x, br.y);

        // Base Brick
        ctx.fillStyle = br.color;
        ctx.beginPath();
        ctx.roundRect(0, 0, br.w, br.h, 4);
        ctx.fill();

        // 3D Bevel highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(0, 0, br.w, 2);
        ctx.fillRect(0, 0, 2, br.h);

        // 3D Bevel shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, br.h - 2, br.w, 2);
        ctx.fillRect(br.w - 2, 0, 2, br.h);

        // Cracks if damaged
        if (br.maxHp > 1 && br.hp === 1) {
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(br.w * 0.3, 2);
          ctx.lineTo(br.w * 0.5, br.h * 0.6);
          ctx.lineTo(br.w * 0.7, br.h - 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawPaddle(x, y, w, h) {
        ctx.save();
        ctx.translate(x, y);

        // Metallic paddle body
        var grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#f1f5f9');
        grad.addColorStop(0.5, '#cbd5e1');
        grad.addColorStop(1, '#64748b');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(0, 0, w, h, 6);
        ctx.fill();

        // Cyan glow core
        ctx.fillStyle = '#0ea5e9';
        ctx.beginPath();
        ctx.roundRect(w * 0.25, 3, w * 0.5, h - 6, 3);
        ctx.fill();

        ctx.restore();
      }

      function drawBall(ball) {
        ctx.save();
        ctx.translate(ball.x, ball.y);

        var ballGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, ball.r);
        if (ball.fireball) {
          ballGrad.addColorStop(0, '#fef08a');
          ballGrad.addColorStop(0.5, '#f97316');
          ballGrad.addColorStop(1, '#ef4444');
        } else {
          ballGrad.addColorStop(0, '#ffffff');
          ballGrad.addColorStop(0.6, '#38bdf8');
          ballGrad.addColorStop(1, '#0284c7');
        }
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawPowerup(pu) {
        ctx.save();
        ctx.translate(pu.x, pu.y);

        var pCol = pu.type === 'multiball' ? '#38bdf8' : pu.type === 'wide' ? '#22c55e' : '#f59e0b';
        var pIcon = pu.type === 'multiball' ? '●●' : pu.type === 'wide' ? '⇔' : '🔥';

        ctx.fillStyle = pCol;
        ctx.beginPath();
        ctx.roundRect(-14, -8, 28, 16, 8);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pIcon, 0, 0);

        ctx.restore();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
