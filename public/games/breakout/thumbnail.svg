<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Breakout thumbnail">
  <defs>
    <linearGradient id="boBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140d24"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="paddleGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="520" height="300" rx="16" fill="url(#boBg)"/>
  <!-- Ambient glow -->
  <circle cx="260" cy="180" r="120" fill="#8b5cf6" opacity="0.1"/>
  <!-- Bricks -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="70" height="20" rx="4" fill="#ff3366"/>
    <rect x="80" y="0" width="70" height="20" rx="4" fill="#ff3366"/>
    <rect x="160" y="0" width="70" height="20" rx="4" fill="#ff3366" opacity="0.25"/>
    <rect x="240" y="0" width="70" height="20" rx="4" fill="#ff3366"/>
    <rect x="320" y="0" width="70" height="20" rx="4" fill="#ff3366"/>

    <rect x="0" y="28" width="70" height="20" rx="4" fill="#ff8800"/>
    <rect x="80" y="28" width="70" height="20" rx="4" fill="#ff8800"/>
    <rect x="160" y="28" width="70" height="20" rx="4" fill="#ff8800"/>
    <rect x="240" y="28" width="70" height="20" rx="4" fill="#ff8800"/>
    <rect x="320" y="28" width="70" height="20" rx="4" fill="#ff8800"/>

    <rect x="0" y="56" width="70" height="20" rx="4" fill="#f59e0b"/>
    <rect x="80" y="56" width="70" height="20" rx="4" fill="#f59e0b"/>
    <rect x="160" y="56" width="70" height="20" rx="4" fill="#f59e0b"/>
    <rect x="240" y="56" width="70" height="20" rx="4" fill="#f59e0b"/>
    <rect x="320" y="56" width="70" height="20" rx="4" fill="#f59e0b"/>
  </g>
  <!-- Shattered particles -->
  <circle cx="225" cy="50" r="3" fill="#ff3366"/>
  <circle cx="218" cy="62" r="4" fill="#ff3366"/>
  <circle cx="235" cy="58" r="2" fill="#ff3366"/>
  <circle cx="242" cy="70" r="3" fill="#ff8800"/>
  <!-- Ball with motion blur trail -->
  <line x1="220" y1="130" x2="250" y2="190" stroke="rgba(139, 92, 246, 0.4)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="220" cy="130" r="10" fill="#ffffff"/>
  <circle cx="220" cy="130" r="16" fill="rgba(139, 92, 246, 0.3)"/>
  <!-- Paddle -->
  <rect x="180" y="240" width="140" height="14" rx="6" fill="url(#paddleGlow)"/>
  <rect x="190" y="242" width="120" height="3" rx="1" fill="#ffffff" opacity="0.7"/>
  <!-- Title & Badge -->
  <g font-family="system-ui, sans-serif" font-weight="900">
    <text x="44" y="220" fill="#a78bfa" font-size="24" letter-spacing="-0.03em">BREAKOUT</text>
    <rect x="44" y="232" width="80" height="20" rx="4" fill="rgba(139,92,246,0.14)" stroke="rgba(139,92,246,0.3)"/>
    <text x="84" y="246" fill="#a78bfa" font-size="10" text-anchor="middle" font-weight="800">PHYSICS</text>
  </g>
</svg>
